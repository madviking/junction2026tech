[project]
name = "junction2026-backend"
version = "0.1.0"
description = "Junction 2026 hackathon backend (thin FastAPI scaffold)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "redis==7.3.0",
  "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]
"app/**/cli.py" = ["T20"]
