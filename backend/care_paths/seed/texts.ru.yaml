ui.screening.learn.why.title: "Почему это важно"
ui.screening.learn.why.lead: "Короткий тест, который защищает вас на годы."
ui.screening.learn.why.early_title: "Он находит изменения рано"
ui.screening.learn.why.early_body: "Рак шейки матки развивается медленно, много лет. Тест находит изменения клеток задолго до того, как они станут раком. Ранние изменения легко лечить."
ui.screening.learn.why.no_symptoms_title: "Можно чувствовать себя хорошо и всё равно нуждаться в тесте"
ui.screening.learn.why.no_symptoms_body: "ВПЧ и ранние изменения клеток не вызывают симптомов. Поэтому тест предназначен для женщин, которые чувствуют себя здоровыми."
ui.screening.learn.why.hpv_title: "ВПЧ встречается очень часто"
ui.screening.learn.why.hpv_body: "Большинство людей когда-то в жизни заражаются ВПЧ. Обычно он проходит сам. ВПЧ — не признак измены, и он ничего плохого не говорит о вас или вашем партнёре."
ui.screening.learn.why.works_title: "Скрининг спасает жизни"
ui.screening.learn.why.works_body: "С тех пор как в Финляндии начался скрининг, рак шейки матки стал гораздо реже. Лучшая защита — участвовать каждый раз, когда вас приглашают."
ui.screening.learn.why.works_badge: "Раз в 5 лет"
ui.screening.learn.visit.title: "Что происходит на приёме"
ui.screening.learn.visit.lead: "От двери до мазка, шаг за шагом."
ui.screening.learn.visit.before_title: "Перед приёмом"
ui.screening.learn.visit.before_body: "Подготовьте:"
ui.screening.learn.visit.prep_form: "Заполните анкету о здоровье, которая пришла с письмом."
ui.screening.learn.visit.prep_id: "Возьмите карточку Kela или другой документ."
ui.screening.learn.visit.prep_period: "Не во время менструации. При необходимости перенесите время."
ui.screening.learn.visit.prep_gel: "Никаких вагинальных лекарств и гелей за 1–2 дня."
ui.screening.learn.visit.arrive_title: "В лаборатории"
ui.screening.learn.visit.arrive_body: "Зарегистрируйтесь у стойки или в автомате. Медсестра пригласит вас в отдельный кабинет. Весь приём занимает около 10 минут."
ui.screening.learn.visit.arrive_badge: "10 мин"
ui.screening.learn.visit.sample_title: "Взятие мазка"
ui.screening.learn.visit.sample_body: "Вы раздеваетесь ниже пояса и ложитесь на смотровое кресло. Длинную кофту или юбку можно не снимать. Медсестра осторожно раскрывает влагалище небольшим инструментом (зеркалом) и берёт клетки мягкой щёточкой. Это занимает пару минут."
ui.screening.learn.visit.feel_title: "Какие ощущения"
ui.screening.learn.visit.feel_body: "Может быть немного неприятно, но больно быть не должно. Дышите спокойно и расслабьте ноги. Скажите медсестре, если больно. Можно попросить паузу."
ui.screening.learn.rights.title: "Ваши права"
ui.screening.learn.rights.lead: "Вы решаете, что происходит с вашим телом и на приёме."
ui.screening.learn.rights.intro_title: "Решаете вы"
ui.screening.learn.rights.intro_body: "Это ваши права на приёме скрининга. Вы можете попросить о любом из них."
ui.screening.learn.rights.female: "Можно попросить, чтобы мазок взяла женщина. Большинство медсестёр, берущих мазок, — женщины."
ui.screening.learn.rights.interpreter: "Можно попросить переводчика. Назовите свой язык, когда звоните в службу поддержки."
ui.screening.learn.rights.companion: "Можно прийти с человеком, которому вы доверяете."
ui.screening.learn.rights.stop: "Можно в любой момент попросить медсестру остановиться или сделать паузу."
ui.screening.learn.rights.choice: "Участие бесплатное и по вашему выбору. Можно перенести время или отказаться."
ui.screening.learn.rights.private: "Персонал обязан хранить ваши данные в тайне."
ui.screening.learn.phrase.title: "Покажите это у стойки"
ui.screening.learn.phrase.lead: "Короткие фразы на финском. Покажите экран или нажмите «воспроизвести»."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "Я бы хотела, чтобы мазок взяла женщина."
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "Мне нужен переводчик."
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "Я волнуюсь. Не могли бы вы делать всё медленно?"
ui.screening.learn.after.title: "После приёма"
ui.screening.learn.after.lead: "Когда придёт результат и что он значит."
ui.screening.learn.after.home_title: "Сразу после приёма"
ui.screening.learn.after.home_body: "Можно сразу вернуться к своим делам. Небольшие мажущие выделения — это нормально."
ui.screening.learn.after.results_title: "Результат придёт по почте"
ui.screening.learn.after.results_body: "Результат придёт по почте или в OmaPosti примерно в течение двух месяцев. Его не видно в OmaKanta или Maisa. Если через три месяца ничего не пришло, позвоните в службу поддержки лаборатории."
ui.screening.learn.after.results_badge: "Около 2 мес."
ui.screening.learn.after.normal_title: "Нормальный результат"
ui.screening.learn.after.normal_body: "Больше ничего делать не нужно. Новое приглашение придёт примерно через пять лет."
ui.screening.learn.after.more_title: "Если нужны дополнительные обследования"
ui.screening.learn.after.more_body: "Вы получите письмо с инструкциями. Небольшие изменения проверяют новым мазком в течение двух лет. Другие изменения врач осматривает увеличительным прибором (кольпоскопия). Это не значит, что у вас рак: изменения часто проходят сами, а остальные легко лечатся."
ui.screening.learn.faq.title: "Частые вопросы"
ui.screening.learn.faq.lead: "Нажмите на вопрос, чтобы увидеть ответ."
ui.screening.learn.faq.hurt_q: "Это больно?"
ui.screening.learn.faq.hurt_a: "Обычно нет. Может быть неприятно на короткое время. Скажите медсестре, если больно, — она остановится или будет действовать медленнее."
ui.screening.learn.faq.hpv_q: "Положительный результат на ВПЧ означает, что у меня рак?"
ui.screening.learn.faq.hpv_a: "Нет. ВПЧ встречается очень часто и обычно проходит сам. Положительный результат значит лишь, что нужно ещё одно обследование."
ui.screening.learn.faq.period_q: "У меня началась менструация. Что делать?"
ui.screening.learn.faq.period_a: "Перенесите время. Во время менструации мазок не берут. Другие выделения не мешают."
ui.screening.learn.faq.pregnant_q: "Я беременна или кормлю грудью."
ui.screening.learn.faq.pregnant_a: "Обычно участвовать можно до 35-й недели беременности и во время кормления грудью. После родов подождите, пока закончатся послеродовые выделения."
ui.screening.learn.faq.never_q: "У меня никогда не было секса. Нужен ли мне тест?"
ui.screening.learn.faq.never_a: "Ваш риск очень низкий, потому что ВПЧ передаётся при сексуальном контакте. Вы всё равно можете участвовать: скажите медсестре, она может использовать маленькое зеркало. Можно также отменить запись."
ui.screening.learn.faq.cutting_q: "Мне сделали женское обрезание. Могу ли я участвовать?"
ui.screening.learn.faq.cutting_a: "Да. Скажите медсестре перед взятием мазка. Она может действовать медленно и использовать зеркало меньшего размера. Можно также сначала попросить приём у врача."
ui.screening.learn.faq.removed_q: "Мне удалили матку."
ui.screening.learn.faq.removed_a: "Всё равно приходите. Мазок в этом случае берут из влагалища."
ui.screening.learn.faq.time_q: "Время мне не подходит."
ui.screening.learn.faq.time_a: "Измените его онлайн с помощью кода бронирования и PIN-кода из письма или позвоните в службу поддержки лаборатории. Можно выбрать любую лабораторию HUS, где берут скрининговые мазки."
ui.screening.learn.faq.letter_q: "Я потеряла письмо или оно не пришло."
ui.screening.learn.faq.letter_a: "Позвоните в службу поддержки лаборатории. Если в ваш год скрининга письмо не пришло, вы можете записаться сами."
ui.screening.learn.faq.cost_q: "Это платно?"
ui.screening.learn.faq.cost_a: "Нет. Скрининг бесплатный."

