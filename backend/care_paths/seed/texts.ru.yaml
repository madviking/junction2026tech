ui.screening.letter.what_body: "Медсестра мягкой щёточкой берёт небольшой мазок клеток с шейки матки. Это занимает пару минут. Если вам 30 лет или больше, образец проверяют на ВПЧ — вирус, который вызывает почти все случаи рака шейки матки. Если вам меньше 30, делают мазок Папаниколау (ПАП-тест)."
ui.screening.letter.prepare_title: "Перед приёмом"
ui.screening.letter.prepare_1: "Заполните приложенную анкету о здоровье и возьмите её с собой."
ui.screening.letter.prepare_2: "Возьмите карточку Kela или другой документ, удостоверяющий личность."
ui.screening.letter.prepare_3: "Во время менструации мазок не берут. Если менструация выпадает на этот день, перенесите время."
ui.screening.letter.prepare_4: "Не используйте вагинальные свечи и гели за 1–2 дня до приёма."
ui.screening.letter.change_title: "Перенос или отмена записи"
ui.screening.letter.change_body: "Если время не подходит, измените его онлайн с помощью кода бронирования и PIN-кода выше или позвоните в службу поддержки лаборатории. Если вы не хотите участвовать, отмените запись, чтобы время мог использовать кто-то другой."
ui.screening.letter.results_title: "Результаты"
ui.screening.letter.results_body: "Результат придёт по почте или в OmaPosti примерно в течение двух месяцев. Если он нормальный, вас снова пригласят через пять лет. Если нужны дополнительные обследования, вы получите инструкции и отдельное приглашение."
