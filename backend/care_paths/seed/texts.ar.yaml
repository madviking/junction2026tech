ui.screening.learn.why.no_symptoms_body: "فيروس HPV وتغيرات الخلايا المبكرة لا تسبب أعراضًا. لهذا الفحص مخصص للنساء اللواتي يشعرن بأنهن بصحة جيدة."
ui.screening.learn.why.hpv_title: "فيروس HPV شائع جدًا"
ui.screening.learn.why.hpv_body: "يصاب معظم الناس بفيروس HPV في مرحلة ما من حياتهم، وغالبًا ما يزول من تلقاء نفسه. الإصابة به ليست دليلًا على الخيانة، ولا تعني شيئًا سيئًا عنك أو عن شريكك."
ui.screening.learn.why.works_title: "الفحص ينقذ الأرواح"
ui.screening.learn.why.works_body: "منذ بدء الفحص في فنلندا أصبح سرطان عنق الرحم أندر بكثير. أفضل حماية هي أن تشاركي في كل مرة تُدعين فيها."
