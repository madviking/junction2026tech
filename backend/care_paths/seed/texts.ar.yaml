ui.screening.learn.visit.sample_title: "أخذ العينة"
ui.screening.learn.visit.sample_body: "تخلعين ملابسك من الخصر إلى الأسفل وتستلقين على سرير الفحص. يمكنك إبقاء قميص طويل أو تنورة. تفتح الممرضة المهبل بلطف بأداة صغيرة (منظار) وتأخذ الخلايا بفرشاة ناعمة. يستغرق ذلك دقيقتين تقريبًا."
ui.screening.learn.visit.feel_title: "كيف يكون الشعور"
ui.screening.learn.visit.feel_body: "قد تشعرين بانزعاج بسيط، لكن لا ينبغي أن يؤلم. تنفّسي ببطء وأرخي ساقيك. أخبري الممرضة إذا شعرت بألم. يمكنك طلب استراحة."
