ui.screening.learn.after.home_title: "مباشرة بعد الموعد"
ui.screening.learn.after.home_body: "يمكنك متابعة يومك فورًا. نزول نقاط دم قليلة أمر طبيعي."
ui.screening.learn.after.results_title: "تصل النتيجة بالبريد"
ui.screening.learn.after.results_body: "تصل النتيجة بالبريد أو إلى OmaPosti خلال شهرين تقريبًا. لا تظهر في OmaKanta أو Maisa. إذا لم يصل شيء بعد ثلاثة أشهر، اتصلي بخدمة عملاء المختبر."
ui.screening.learn.after.results_badge: "حوالي شهرين"
ui.screening.learn.after.normal_title: "نتيجة طبيعية"
ui.screening.learn.after.normal_body: "لا حاجة لفعل شيء آخر. ستصلك دعوة جديدة بعد خمس سنوات تقريبًا."
ui.screening.learn.after.more_title: "إذا احتجتِ إلى فحوصات إضافية"
ui.screening.learn.after.more_body: "تصلك رسالة فيها التعليمات. التغيرات البسيطة تُراجع بعينة جديدة خلال سنتين. أما التغيرات الأخرى فيفحصها الطبيب بأداة مكبّرة (تنظير المهبل). هذا لا يعني أن لديك سرطانًا: كثيرًا ما تُشفى التغيرات من تلقاء نفسها، والباقي سهل العلاج."
ui.screening.learn.faq.title: "أسئلة شائعة"
ui.screening.learn.faq.lead: "اضغطي على سؤال لرؤية الإجابة."
ui.screening.learn.faq.hurt_q: "هل يؤلم؟"
ui.screening.learn.faq.hurt_a: "عادةً لا. قد تشعرين بانزعاج للحظة. أخبري الممرضة إذا شعرت بألم، وستتوقف أو تتمهّل."
ui.screening.learn.faq.hpv_q: "هل تعني نتيجة HPV الإيجابية أن لديّ سرطانًا؟"
ui.screening.learn.faq.hpv_a: "لا. فيروس HPV شائع جدًا وغالبًا ما يزول من تلقاء نفسه. النتيجة الإيجابية تعني فقط أنك تحتاجين إلى فحص آخر."
ui.screening.learn.faq.period_q: "بدأت دورتي الشهرية. ماذا أفعل؟"
ui.screening.learn.faq.period_a: "غيّري موعدك. لا تؤخذ العينة أثناء الدورة الشهرية. الإفرازات الأخرى لا تمنع الفحص."
ui.screening.learn.faq.pregnant_q: "أنا حامل أو مرضعة."
ui.screening.learn.faq.pregnant_a: "يمكنك عادةً المشاركة حتى الأسبوع 35 من الحمل، وأثناء الرضاعة. بعد الولادة، انتظري حتى يتوقف نزيف النفاس."
ui.screening.learn.faq.never_q: "لم أمارس الجنس قط. هل أحتاج إلى الفحص؟"
ui.screening.learn.faq.never_a: "خطرك منخفض جدًا، لأن فيروس HPV ينتقل بالاتصال الجنسي. يمكنك المشاركة مع ذلك: أخبري الممرضة، ويمكنها استخدام منظار صغير. ويمكنك أيضًا إلغاء الموعد."
