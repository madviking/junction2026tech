ui.screening.learn.why.early_body: "ينمو سرطان عنق الرحم ببطء على مدى سنوات كثيرة. يكتشف الفحص تغيرات الخلايا قبل وقت طويل من تحوّلها إلى سرطان. التغيرات المبكرة سهلة العلاج."
