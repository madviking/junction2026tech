ui.screening.learn.rights.lead: "القرار لكِ في ما يخص جسدك وموعدك."
ui.screening.learn.rights.intro_title: "أنتِ من تقرّر"
ui.screening.learn.rights.intro_body: "هذه حقوقك في موعد الفحص. يمكنك أن تطلبي أيًا منها."
ui.screening.learn.rights.female: "يمكنك أن تطلبي أن تأخذ العينة امرأة. معظم من يأخذون العينات نساء."
ui.screening.learn.rights.interpreter: "يمكنك طلب مترجم. اذكري لغتك عند الاتصال بخدمة العملاء."
ui.screening.learn.rights.companion: "يمكنك اصطحاب شخص تثقين به."
ui.screening.learn.rights.stop: "يمكنك أن تطلبي من الممرضة التوقف أو الاستراحة في أي وقت."
ui.screening.learn.rights.choice: "المشاركة مجانية واختيارك أنتِ. يمكنك تغيير الموعد أو الرفض."
ui.screening.learn.rights.private: "يلتزم الموظفون بسرية معلوماتك."
ui.screening.learn.phrase.title: "اعرضي هذا عند المكتب"
ui.screening.learn.phrase.lead: "جمل قصيرة بالفنلندية. اعرضي الشاشة أو اضغطي تشغيل."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "أودّ أن تأخذ العينة امرأة."
