ui.screening.learn.why.no_symptoms_body: "HPV同早期細胞變化唔會有病徵。所以呢個檢查係俾覺得健康嘅女士做嘅。"
ui.screening.learn.why.hpv_title: "HPV非常普遍"
ui.screening.learn.why.hpv_body: "大部分人一生中某個時候都會感染HPV，通常會自己消失。感染HPV唔代表唔忠，亦都唔代表你或者你伴侶有咩唔好。"
ui.screening.learn.why.works_title: "篩查救命"
ui.screening.learn.why.works_body: "芬蘭開始篩查之後，子宮頸癌少咗好多。每次收到邀請都參加，就係最好嘅保護。"
ui.screening.learn.why.works_badge: "每5年一次"
ui.screening.learn.visit.title: "睇嘅時候會做咩"
ui.screening.learn.visit.lead: "由入門口到攞樣本，一步一步嚟。"
ui.screening.learn.visit.before_title: "睇之前"
ui.screening.learn.visit.before_body: "準備好呢啲："
ui.screening.learn.visit.prep_form: "填好隨信寄嚟嘅健康問卷。"
ui.screening.learn.visit.prep_id: "帶Kela卡或者其他身份證明文件。"
ui.screening.learn.visit.prep_period: "唔好喺月經期間去，有需要就改時間。"
ui.screening.learn.visit.prep_gel: "之前1至2日唔好用陰道藥物或者啫喱。"
ui.screening.learn.visit.arrive_title: "喺化驗所"
ui.screening.learn.visit.arrive_body: "喺櫃枱或者自助登記機登記。護士會叫你入獨立房間。成個應診大約10分鐘。"
ui.screening.learn.visit.arrive_badge: "10分鐘"
ui.screening.learn.visit.sample_title: "攞樣本"
ui.screening.learn.visit.sample_body: "你除咗腰以下嘅衫褲，瞓喺檢查床上。可以著住長衫或者裙。護士會用一個細嘅器具（窺器）輕輕打開陰道，用軟刷攞細胞。只係幾分鐘。"
ui.screening.learn.visit.feel_title: "會有咩感覺"
ui.screening.learn.visit.feel_body: "可能會有少少唔舒服，但唔應該痛。慢慢呼吸，放鬆對腳。如果痛就話俾護士知。你可以要求停一停。"
ui.screening.learn.rights.title: "你嘅權利"
ui.screening.learn.rights.lead: "你嘅身體同應診由你話事。"
ui.screening.learn.rights.intro_title: "由你決定"
ui.screening.learn.rights.intro_body: "呢啲係你喺篩查應診時嘅權利。你可以要求任何一樣。"
ui.screening.learn.rights.female: "你可以要求由女士攞樣本。大部分攞樣本嘅人都係女士。"
ui.screening.learn.rights.interpreter: "你可以要求傳譯員。打電話俾客戶服務時講你嘅語言。"
ui.screening.learn.rights.companion: "你可以帶一個信得過嘅人陪你。"
ui.screening.learn.rights.stop: "你隨時都可以叫護士停或者暫停。"
ui.screening.learn.rights.choice: "參加係免費，由你自己揀。你可以改時間或者拒絕。"
ui.screening.learn.rights.private: "職員一定要為你嘅資料保密。"
ui.screening.learn.phrase.title: "喺櫃枱俾佢哋睇"
ui.screening.learn.phrase.lead: "簡短嘅芬蘭文句子。俾佢哋睇個畫面或者撳播放。"
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "我想由女士幫我攞樣本。"
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "我需要傳譯員。"
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "我好緊張。可唔可以慢慢嚟？"
ui.screening.learn.after.title: "應診之後"
ui.screening.learn.after.lead: "幾時有結果，結果代表咩。"
ui.screening.learn.after.home_title: "應診完即刻"
ui.screening.learn.after.home_body: "你可以即刻繼續你嘅日常。有少少滴血係正常嘅。"
ui.screening.learn.after.results_title: "結果會寄俾你"
ui.screening.learn.after.results_body: "大約兩個月內，結果會經郵寄或者OmaPosti送到。結果唔會喺OmaKanta或者Maisa顯示。如果三個月後都未收到，請打電話俾化驗所客戶服務。"
ui.screening.learn.after.results_badge: "大約2個月"
ui.screening.learn.after.normal_title: "結果正常"
ui.screening.learn.after.normal_body: "唔使再做啲咩。大約五年後你會收到新嘅邀請。"
ui.screening.learn.after.more_title: "如果要做多啲檢查"
ui.screening.learn.after.more_body: "你會收到一封有指示嘅信。輕微變化會喺兩年內用新樣本覆查。其他變化會由醫生用放大儀器檢查（陰道鏡檢查）。咁唔代表你有癌症：變化好多時會自己好返，其餘嘅都好容易醫。"
ui.screening.learn.faq.title: "常見問題"
ui.screening.learn.faq.lead: "撳個問題睇答案。"
ui.screening.learn.faq.hurt_q: "會唔會痛？"
ui.screening.learn.faq.hurt_a: "通常唔會。可能會短暫唔舒服。如果痛就話俾護士知，護士會停低或者慢啲。"
ui.screening.learn.faq.hpv_q: "HPV陽性係咪代表我有癌症？"
ui.screening.learn.faq.hpv_a: "唔係。HPV非常普遍，通常會自己消失。陽性結果只係代表你要再做一次檢查。"
ui.screening.learn.faq.period_q: "我嚟咗月經，點算？"
ui.screening.learn.faq.period_a: "請改時間。月經期間唔會攞樣本。其他分泌物冇問題。"
ui.screening.learn.faq.pregnant_q: "我有咗或者喺度餵人奶。"
ui.screening.learn.faq.pregnant_a: "通常懷孕35週之前同埋餵人奶期間都可以參加。生完BB之後，等產後出血停咗先。"
ui.screening.learn.faq.never_q: "我從來未有過性行為，需唔需要做檢查？"
ui.screening.learn.faq.never_a: "你嘅風險好低，因為HPV經性接觸傳播。你仍然可以參加：話俾護士知，護士可以用細號窺器。你亦都可以取消預約。"
ui.screening.learn.faq.cutting_q: "我受過女性割禮，可唔可以參加？"
ui.screening.learn.faq.cutting_a: "可以。攞樣本之前話俾護士知。護士可以慢慢嚟，用細啲嘅窺器。你亦都可以先要求睇醫生。"
ui.screening.learn.faq.removed_q: "我嘅子宮已經切除咗。"
ui.screening.learn.faq.removed_a: "都係要嚟。咁樣會喺陰道攞樣本。"
ui.screening.learn.faq.time_q: "個時間唔啱我。"
ui.screening.learn.faq.time_a: "用信入面嘅預約編號同PIN碼喺網上改，或者打電話俾化驗所客戶服務。你可以揀任何一間有攞篩查樣本嘅HUS化驗所。"
ui.screening.learn.faq.letter_q: "我唔見咗封信，或者從來冇收到。"
ui.screening.learn.faq.letter_a: "打電話俾化驗所客戶服務。如果你嘅篩查年度冇收到信，你可以自己預約。"
ui.screening.learn.faq.cost_q: "使唔使俾錢？"
ui.screening.learn.faq.cost_a: "唔使。篩查係免費嘅。"
