barrier.B7.looks: "Підліток перекладає діагноз"
barrier.B7.fix: "Режим помічника спрямовує до професійного перекладача і захищає дитину"
barrier.B7.step.text: "Режим помічника: родич отримує сценарій, щоб попросити професійного перекладача"
barrier.B7.step.detail: "Розмова про діагноз не йде через дитину"
barrier.B8.name: "Страх через статус"
barrier.B8.looks: "Без документів або розгляд заяви про притулок"
barrier.B8.fix: "Без імені й ідентифікатора; шлях через волонтерську клініку; пояснення конфіденційності; швидкий вихід"
barrier.B8.step.text: "Пояснено конфіденційність; запропоновано волонтерську клініку"
barrier.B8.step.detail: "Кнопка швидкого виходу завжди видима"
barrier.B9.name: "Обов'язки з догляду"
barrier.B9.looks: "Самотній батько чи мати, особа, що доглядає"
barrier.B9.fix: "Позначити в підсумку візиту; планувати з урахуванням обов'язків"
barrier.B9.step.text: "Обов'язки з догляду позначено в підсумку візиту"
barrier.B10.name: "Тривога, перевантаження"
barrier.B10.looks: "Завмирає, уникає листів"
barrier.B10.fix: "Малі кроки, перевірки, один рядок про те, що буде далі"
barrier.B10.step.text: "Щотижнева перевірка з одним рядком про наступний крок"
