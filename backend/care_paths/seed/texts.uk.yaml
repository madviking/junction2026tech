barrier.B2.step.detail: "Не потрібно телефонувати в робочий час"
barrier.B3.name: "Відстань"
barrier.B3.looks: "Село, немає авто"
barrier.B3.fix: "Попросити перший прийом дистанційно (закон це дозволяє); пояснити компенсацію проїзду від Kela"
barrier.B3.step.text: "Попросіть перший прийом дистанційно; пояснено компенсацію проїзду"
barrier.B4.name: "Недовіра"
barrier.B4.looks: "Минула дискримінація, відчуття, що її не сприйняли серйозно"
barrier.B4.fix: "Картка прав; попросити іншого фахівця; сходи подання скарг"
barrier.B4.step.text: "Картка прав під час візиту"
barrier.B4.step.detail: "Ви можете попросити іншого фахівця"
barrier.B5.name: "Стигма"
barrier.B5.looks: "Куріння і рак легень, інтимні симптоми, фаталізм"
barrier.B5.fix: "Нейтральні формулювання без осуду; пояснити, що раннє лікування допомагає"
barrier.B5.step.text: "Формулювання без осуду скрізь"
barrier.B5.step.detail: "Пояснює, що раннє лікування допомагає"
barrier.B6.name: "Стать або скромність"
barrier.B6.looks: "Хоче лікарку"
barrier.B6.fix: "Допомогти попросити бажаного фахівця; це прохання, а не гарантія"
barrier.B6.step.text: "Попросіть лікарку або бажаного фахівця"
barrier.B6.step.detail: "Прохання в межах можливостей закладу, не гарантія"
