ui.screening.learn.after.more_body: "Ви отримаєте лист з інструкціями. Невеликі зміни перевіряють новим зразком протягом двох років. Інші зміни лікар оглядає збільшувальним приладом (кольпоскопія). Це не означає, що у вас рак: зміни часто минають самі, а решту легко лікувати."
ui.screening.learn.faq.title: "Поширені запитання"
ui.screening.learn.faq.lead: "Натисніть на запитання, щоб побачити відповідь."
ui.screening.learn.faq.hurt_q: "Це боляче?"
ui.screening.learn.faq.hurt_a: "Зазвичай ні. На мить може бути неприємно. Скажіть медсестрі, якщо боляче, — вона зупиниться або діятиме повільніше."
ui.screening.learn.faq.hpv_q: "Позитивний результат на ВПЛ означає, що в мене рак?"
ui.screening.learn.faq.hpv_a: "Ні. ВПЛ дуже поширений і зазвичай минає сам. Позитивний результат означає лише, що потрібне ще одне обстеження."
ui.screening.learn.faq.period_q: "У мене почалася менструація. Що робити?"
ui.screening.learn.faq.period_a: "Змініть час. Під час менструації зразок не беруть. Інші виділення не заважають."
ui.screening.learn.faq.pregnant_q: "Я вагітна або годую грудьми."
ui.screening.learn.faq.pregnant_a: "Зазвичай брати участь можна до 35-го тижня вагітності та під час годування грудьми. Після пологів зачекайте, поки закінчаться післяпологові виділення."
ui.screening.learn.faq.never_q: "У мене ніколи не було сексу. Чи потрібен мені тест?"
ui.screening.learn.faq.never_a: "Ваш ризик дуже низький, бо ВПЛ передається під час сексуального контакту. Ви все одно можете взяти участь: скажіть медсестрі, вона може використати маленьке дзеркало. Можна також скасувати запис."
ui.screening.learn.faq.cutting_q: "Мені зробили жіноче обрізання. Чи можу я взяти участь?"
ui.screening.learn.faq.cutting_a: "Так. Скажіть медсестрі перед взяттям зразка. Вона може діяти повільно й використати менше дзеркало. Можна також спершу попросити прийом у лікаря."
ui.screening.learn.faq.removed_q: "Мені видалили матку."
ui.screening.learn.faq.removed_a: "Все одно приходьте. Зразок тоді беруть із піхви."
ui.screening.learn.faq.time_q: "Час мені не підходить."
ui.screening.learn.faq.time_a: "Змініть його онлайн за допомогою коду бронювання та PIN-коду з листа або зателефонуйте до служби підтримки лабораторії. Можна вибрати будь-яку лабораторію HUS, де беруть скринінгові зразки."
ui.screening.learn.faq.letter_q: "Я загубила лист або він не прийшов."
ui.screening.learn.faq.letter_a: "Зателефонуйте до служби підтримки лабораторії. Якщо у ваш рік скринінгу лист не прийшов, ви можете записатися самі."
ui.screening.learn.faq.cost_q: "Це платно?"
ui.screening.learn.faq.cost_a: "Ні. Скринінг безоплатний."
