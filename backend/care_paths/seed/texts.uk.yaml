lane.U0.name: "Невідкладна допомога"
lane.U0.trigger: "Сильна кровотеча, тяжка задишка, раптова слабкість, сплутаність свідомості, біль у грудях"
lane.U0.tone: "Один екран, одна дія"
lane.U1.name: "Того ж дня"
lane.U1.trigger: "Новий сильний біль, блювання кров'ю, висока температура під час лікування раку"
lane.U1.tone: "Спокійно й прямо"
lane.U2.name: "Тривожний симптом"
lane.U2.trigger: "Ґуля, кровотеча без причини, кров у калі, кашель понад 3 тижні зі втратою ваги, кровотеча після менопаузи, родимка, що змінюється"
lane.U2.tone: "Серйозно, але не лякаючи; діагноз не називається"
lane.U3.name: "Тривалий незрозумілий стан"
lane.U3.trigger: "Втома, невизначений біль, втрата апетиту впродовж кількох тижнів"
lane.U3.tone: "Заспокійливо, з чіткими правилами, коли звернутися знову"
lane.U4.name: "Скринінг"
lane.U4.trigger: "Лист-запрошення, пропущений скринінг, позитивний результат"
lane.U4.tone: "Пояснити, що означає лист"
lane.U5.name: "Зупинилося"
lane.U5.trigger: "Направлення надіслано, а листа немає, немає результату, лікування починається із запізненням"
lane.U5.tone: "Практично, з посиланням на права"
