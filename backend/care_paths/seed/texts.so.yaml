barrier.B1.name: "Kharash"
barrier.B1.looks: "Daryeelka ayuu ka tagaa isagoo ka cabsanaya khidmadaha"
barrier.B1.fix: "Tus khidmadda dhabta ah iyo xadka 815 EUR; caafimaadka shaqada waa bilaash; daryeel daahay meel kale wuxuu ku kacaa khidmadda caadiga ah"
barrier.B1.step.text: "Sharaxaadda khidmadda kahor la xiriirka"
barrier.B2.name: "Waqti, shaqo"
barrier.B2.looks: "Ma wici karo 8-16, shaqo beddelaad ah"
barrier.B2.fix: "Kanaalka sheekaysiga ama farriinta; u diyaari wicitaanka inuu qaado saddex daqiiqo; caafimaadka shaqada"
