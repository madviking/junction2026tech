ui.screening.learn.why.title: "Sababta ay muhiim u tahay"
ui.screening.learn.why.lead: "Baaritaan gaaban oo sannado ku ilaaliya."
ui.screening.learn.why.early_title: "Wuxuu helaa isbeddellada goor hore"
ui.screening.learn.why.early_body: "Kansarka afka ilmo-galeenku si tartiib ah ayuu u koraa, sannado badan. Baaritaanku wuxuu helaa isbeddellada unugyada muddo dheer ka hor intaanay kansar noqon. Isbeddellada hore way fudud yihiin in la daaweeyo."
ui.screening.learn.why.no_symptoms_title: "Waxaad dareemi kartaa caafimaad haddana waad u baahan tahay"
ui.screening.learn.why.no_symptoms_body: "HPV iyo isbeddellada hore ee unugyadu ma keenaan calaamado. Sidaas darteed baaritaanku waxaa loogu talagalay haweenka caafimaadka qaba."
ui.screening.learn.why.hpv_title: "HPV aad buu u badan yahay"
ui.screening.learn.why.hpv_body: "Dadka intooda badan waxay qaadaan HPV mar uun noloshooda. Badanaa iskiis ayuu u baxaa. HPV ma aha calaamad khiyaano, waxna kaama sheegayo adiga ama lammaanahaaga."
ui.screening.learn.why.works_title: "Baaritaanku naf buu badbaadiyaa"
ui.screening.learn.why.works_body: "Tan iyo markii baaritaanku ka bilaabmay Finland, kansarka afka ilmo-galeenku aad buu u yaraaday. Ilaalinta ugu fiican waa inaad ka qayb gasho mar kasta oo lagu casuumo."
ui.screening.learn.why.works_badge: "Shantii sanaba mar"
ui.screening.learn.visit.title: "Waxa ka dhaca ballanta"
ui.screening.learn.visit.lead: "Albaabka ilaa muunadda, tallaabo tallaabo."
ui.screening.learn.visit.before_title: "Ballanta ka hor"
ui.screening.learn.visit.before_body: "Diyaari waxyaabahan:"
ui.screening.learn.visit.prep_form: "Buuxi foomka caafimaadka ee warqadda la socday."
ui.screening.learn.visit.prep_id: "Keen kaarka Kela ama aqoonsi kale."
ui.screening.learn.visit.prep_period: "Ha iman xilliga caadada. Beddel waqtiga haddii loo baahdo."
ui.screening.learn.visit.prep_gel: "Ha isticmaalin daawo ama jel siilka 1–2 maalmood ka hor."
ui.screening.learn.visit.arrive_title: "Shaybaarka"
ui.screening.learn.visit.arrive_body: "Iska diiwaan geli miiska ama mashiinka diiwaangelinta. Kalkaalisadu waxay kuugu yeeraysaa qol gaar ah. Ballanta oo dhan waxay qaadataa qiyaastii 10 daqiiqo."
ui.screening.learn.visit.arrive_badge: "10 daqiiqo"
ui.screening.learn.visit.sample_title: "Qaadista muunadda"
ui.screening.learn.visit.sample_body: "Waxaad iska bixinaysaa dharka dhexda ka hoose, waxaadna ku jiifsanaysaa sariirta baaritaanka. Shaati dheer ama goonno waad sii xiran kartaa. Kalkaalisadu waxay si tartiib ah siilka ugu furaysaa qalab yar (speculum), waxayna unugyada ku qaadaysaa burush jilicsan. Waxay qaadataa dhowr daqiiqo."
ui.screening.learn.visit.feel_title: "Sida ay dareemayso"
ui.screening.learn.visit.feel_body: "Waxaa laga yaabaa inay xoogaa raaxo darro yeelato, laakiin waa inaysan xanuunin. Si tartiib ah u neefso oo lugahaaga dabci. U sheeg kalkaalisada haddii ay xanuunto. Waxaad codsan kartaa nasasho."
ui.screening.learn.rights.title: "Xuquuqdaada"
ui.screening.learn.rights.lead: "Adiga ayaa go'aan ka gaara jirkaaga iyo ballantaada."
ui.screening.learn.rights.intro_title: "Adigaa go'aamiya"
ui.screening.learn.rights.intro_body: "Kuwani waa xuquuqdaada ballanta baaritaanka. Waxaad codsan kartaa mid kasta oo ka mid ah."
ui.screening.learn.rights.female: "Waxaad codsan kartaa in muunadda ay qaado haweeney. Inta badan kuwa muunadda qaada waa haween."
ui.screening.learn.rights.interpreter: "Waxaad codsan kartaa turjubaan. Sheeg luqaddaada markaad wacayso adeegga macaamiisha."
ui.screening.learn.rights.companion: "Waxaad la iman kartaa qof aad aaminsan tahay."
ui.screening.learn.rights.stop: "Waxaad kalkaalisada ka codsan kartaa inay joojiso ama nasato wakhti kasta."
ui.screening.learn.rights.choice: "Ka qaybgalku waa bilaash waana doorashadaada. Waxaad beddeli kartaa waqtiga ama diidi kartaa."
ui.screening.learn.rights.private: "Shaqaaluhu waa inay sir ka dhigaan macluumaadkaaga."
ui.screening.learn.phrase.title: "Tan ku tus miiska"
ui.screening.learn.phrase.lead: "Weedho gaagaaban oo Finnish ah. Tus shaashadda ama riix ciyaar."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "Waxaan jeclaan lahaa in muunadda ay qaado haweeney."
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "Waxaan u baahanahay turjubaan."
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "Waan walwalsanahay. Ma si tartiib ah ayaad u socon kartaa?"
ui.screening.learn.after.title: "Ballanta kadib"
ui.screening.learn.after.lead: "Goorta natiijadu timaado iyo waxa ay ka dhigan tahay."
ui.screening.learn.after.home_title: "Isla markiiba ballanta kadib"
ui.screening.learn.after.home_body: "Isla markiiba waad sii wadan kartaa maalintaada. Dhiig yar oo dhibic ah waa caadi."
ui.screening.learn.after.results_title: "Natiijadu boosta ayay ku timaadaa"
ui.screening.learn.after.results_body: "Natiijadu waxay ku imaanaysaa boosta ama OmaPosti qiyaastii laba bilood gudahood. Kama muuqato OmaKanta ama Maisa. Haddii aysan waxba iman saddex bilood kadib, wac adeegga macaamiisha ee shaybaarka."
ui.screening.learn.after.results_badge: "Qiyaastii 2 bilood"
ui.screening.learn.after.normal_title: "Natiijo caadi ah"
ui.screening.learn.after.normal_body: "Waxba kale ma jiraan oo aad samayso. Casuumaad cusub ayaad heli doontaa qiyaastii shan sano kadib."
ui.screening.learn.after.more_title: "Haddii aad u baahato baaritaanno dheeraad ah"
ui.screening.learn.after.more_body: "Waxaad heli doontaa warqad tilmaamo leh. Isbeddellada yaryar waxaa lagu hubiyaa muunad cusub laba sano gudahood. Isbeddellada kale dhakhtar ayaa ku eegaya qalab wax weyneeya (colposcopy). Tani macnaheedu maaha inaad kansar qabto: isbeddelladu badanaa iskood ayay u bogsadaan, inta kalena way fudud tahay in la daaweeyo."
ui.screening.learn.faq.title: "Su'aalaha caadiga ah"
ui.screening.learn.faq.lead: "Taabo su'aal si aad u aragto jawaabta."
ui.screening.learn.faq.hurt_q: "Ma xanuunaysaa?"
ui.screening.learn.faq.hurt_a: "Badanaa maya. Waxaa laga yaabaa inay daqiiqad raaxo darro yeelato. U sheeg kalkaalisada haddii ay xanuunto, waxayna joojin doontaa ama si tartiib ah u socon doontaa."
ui.screening.learn.faq.hpv_q: "Natiijo HPV oo togan ma waxay ka dhigan tahay inaan kansar qabo?"
ui.screening.learn.faq.hpv_a: "Maya. HPV aad buu u badan yahay, badanaana iskiis ayuu u baxaa. Natiijo togan waxay kaliya ka dhigan tahay inaad u baahan tahay baaritaan kale."
ui.screening.learn.faq.period_q: "Caadadaydu way bilaabatay. Maxaan sameeyaa?"
ui.screening.learn.faq.period_a: "Beddel waqtigaaga. Muunadda lagama qaado xilliga caadada. Dheecaanka kale dhib ma leh."
ui.screening.learn.faq.pregnant_q: "Waan uurka leeyahay ama waan naas nuujinayaa."
ui.screening.learn.faq.pregnant_a: "Badanaa waxaad ka qayb geli kartaa ilaa toddobaadka 35 ee uurka, iyo inta aad naas nuujinayso. Dhalmada kadib, sug ilaa dhiigga dhalmadu joogsado."
ui.screening.learn.faq.never_q: "Weligay galmo ma samayn. Ma u baahanahay baaritaanka?"
ui.screening.learn.faq.never_a: "Khatartaadu aad bay u yar tahay, sababtoo ah HPV wuxuu ku faafaa xiriirka galmada. Weli waad ka qayb geli kartaa: u sheeg kalkaalisada, oo isticmaali karta speculum yar. Waxaad sidoo kale baajin kartaa waqtiga."
ui.screening.learn.faq.cutting_q: "Waa la i gudday (gudniinka haweenka). Ma ka qayb geli karaa?"
ui.screening.learn.faq.cutting_a: "Haa. U sheeg kalkaalisada ka hor qaadista muunadda. Kalkaalisadu si tartiib ah ayay u socon kartaa, waxayna isticmaali kartaa speculum ka yar. Waxaad sidoo kale marka hore codsan kartaa ballan dhakhtar."
ui.screening.learn.faq.removed_q: "Ilmo-galeenkayga waa la saaray."
ui.screening.learn.faq.removed_a: "Weli kaalay. Markaas muunadda waxaa laga qaadaa siilka."
ui.screening.learn.faq.time_q: "Waqtigu igu habboonayn."
ui.screening.learn.faq.time_a: "Ku beddel internetka adigoo isticmaalaya koodhka ballanta iyo PIN-ka warqaddaada ku qoran, ama wac adeegga macaamiisha ee shaybaarka. Waxaad dooran kartaa shaybaar kasta oo HUS ah oo qaada muunadaha baaritaanka."
ui.screening.learn.faq.letter_q: "Warqaddaydii waan lumiyay, ama weligeed ma iman."
ui.screening.learn.faq.letter_a: "Wac adeegga macaamiisha ee shaybaarka. Haddii aysan warqad iman sannadka baaritaankaaga, adigu ballan ayaad qabsan kartaa."
ui.screening.learn.faq.cost_q: "Lacag ma ku baxaysaa?"
ui.screening.learn.faq.cost_a: "Maya. Baaritaanku waa bilaash."

