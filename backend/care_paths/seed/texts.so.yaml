barrier.B3.name: "Masaafo"
barrier.B3.looks: "Baadiye, gaari ma leh"
barrier.B3.fix: "Codso booqasho koowaad oo fogaan ah (sharcigu wuu ogol yahay); sharax dib-u-bixinta safarka ee Kela"
barrier.B3.step.text: "Codso booqasho koowaad oo fogaan ah; dib-u-bixinta safarka waa la sharaxay"
barrier.B4.name: "Aaminaad-darro"
barrier.B4.looks: "Takoor hore, dareemay in la dayacay"
barrier.B4.fix: "Kaarka xuquuqda; codso xirfadle kale; jaranjarada dacwadda"
barrier.B4.step.text: "Kaarka xuquuqda booqashada"
barrier.B5.name: "Ceeb"
barrier.B5.looks: "Sigaar cabbid iyo kansarka sambabka, calaamado gaar ah, qadar-rumaysnaan"
barrier.B5.fix: "Hadal dhex-dhexaad ah oo aan eed lahayn; sharax in daawaynta hore ay shaqeyso"
barrier.B5.step.text: "Hadal aan eed lahayn meel walba"
barrier.B6.name: "Jinsi ama xishood"
barrier.B6.looks: "Wuxuu rabaa dhakhtar dumar ah"
barrier.B6.fix: "Caawi inuu codsado xirfadle la doonayo; waa codsi, ma aha damaanad"
barrier.B6.step.text: "Codso xirfadle dumar ah ama la doonayo"
barrier.B7.name: "Ilmo ama xubin qoys ayaa turjumaysa"
barrier.B7.looks: "Dhalinyaro ayaa turjumaysa cudur-sheegid"
barrier.B7.fix: "Habka caawiyaha wuxuu u jiheeyaa turjumaan xirfad leh wuxuuna ilaaliyaa ilmaha"
barrier.B7.step.text: "Habka caawiyaha: xubinta qoyska waxay heshaa qoraal ay ku codsato turjumaan xirfad leh"
barrier.B8.name: "Cabsida xaaladda"
barrier.B8.looks: "Aan qoraal haysan ama magangelyo sugaysa"
barrier.B8.fix: "Magac ama aqoonsi ma jiro; waddada rugta iskaa-wax-u-qabso; sharax qarsoodinta; deg-deg u bax"
barrier.B8.step.text: "Qarsoodiga waa la sharaxay; rug iskaa-wax-u-qabso ayaa la bixiyay"
barrier.B9.name: "Waajibaad daryeel"
barrier.B9.looks: "Waalid keli ah, daryeele"
barrier.B9.fix: "Ku calaamadee kooban-booqashada; qorshee waajibaadka agtooda"
barrier.B9.step.text: "Waajibaadka daryeelka waxaa lagu calaamadeeyay kooban-booqashada"
barrier.B10.name: "Welwel, culays"
barrier.B10.looks: "Wuu qaboobaa, warqadaha ayuu ka fogaadaa"
barrier.B10.fix: "Tallaabooyin yaryar, hubin, hal sadar oo ku saabsan waxa xiga"
barrier.B10.step.text: "Hubin toddobaadle ah oo leh hal sadar tallaabo xigta"
