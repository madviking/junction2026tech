lane.U0.name: "Xaalad degdeg ah"
lane.U0.trigger: "Dhiig-bax badan, neefta oo si xun u dhibta, itaal-darro lama filaan ah, wareer, xanuun laabta ah"
lane.U0.tone: "Hal shaashad, hal tallaabo"
lane.U1.name: "Maalinta oo dhan"
lane.U1.trigger: "Xanuun cusub oo daran, dhiig matag, qandho sare inta lagu jiro daawaynta kansarka"
lane.U1.tone: "Degan oo toos ah"
lane.U2.name: "Calaamad digniin ah"
lane.U2.trigger: "Bar kor u baxday, dhiig-bax aan la sharxi karin, dhiig saxarada ku jira, qufac ka badan 3 toddobaad iyo miisaan lumis, dhiig-bax ka dib xilliga nabarka, tin isbeddelaysa"
lane.U2.tone: "Dhab ah, laakiin aan cabsi gelin; cudur lama magacaabo"
lane.U3.name: "Calaamad socota oo aan cadayn"
lane.U3.trigger: "Daal, xanuun aan cadayn, cunto-xumo toddobaadyo ah"
lane.U3.tone: "Xasilin, iyadoo la sheegayo goorta dib loo soo noqonayo"
lane.U4.name: "Baaritaan"
lane.U4.trigger: "Warqad martiqaad, baaritaan ka lumay, natiijo togan"
lane.U4.tone: "Sharax waxa warqaddu ka dhigan tahay"
lane.U5.name: "Waa istaagay"
lane.U5.trigger: "Warqad gudbin la diray laakiin warqad ma timaadin, natiijo maqan, daawayntu waa daahday"
lane.U5.tone: "Wax ku ool ah, xuquuqda ku salaysan"
