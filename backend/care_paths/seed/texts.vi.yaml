ui.screening.learn.why.title: "Vì sao quan trọng"
ui.screening.learn.why.lead: "Một xét nghiệm ngắn bảo vệ bạn nhiều năm."
ui.screening.learn.why.early_title: "Phát hiện thay đổi sớm"
ui.screening.learn.why.early_body: "Ung thư cổ tử cung phát triển chậm, qua nhiều năm. Xét nghiệm phát hiện thay đổi tế bào từ rất lâu trước khi chúng thành ung thư. Thay đổi sớm dễ điều trị."
ui.screening.learn.why.no_symptoms_title: "Bạn có thể khỏe mạnh mà vẫn cần xét nghiệm"
ui.screening.learn.why.no_symptoms_body: "HPV và thay đổi tế bào sớm không gây triệu chứng. Vì vậy xét nghiệm dành cho phụ nữ cảm thấy khỏe mạnh."
ui.screening.learn.why.hpv_title: "HPV rất phổ biến"
ui.screening.learn.why.hpv_body: "Hầu hết mọi người đều nhiễm HPV vào một lúc nào đó trong đời. Thường nó tự hết. Nhiễm HPV không phải dấu hiệu của sự không chung thủy, và không nói lên điều gì xấu về bạn hay bạn đời của bạn."
ui.screening.learn.why.works_title: "Sàng lọc cứu sống nhiều người"
ui.screening.learn.why.works_body: "Từ khi Phần Lan bắt đầu sàng lọc, ung thư cổ tử cung đã trở nên hiếm hơn nhiều. Cách bảo vệ tốt nhất là tham gia mỗi lần được mời."
ui.screening.learn.why.works_badge: "5 năm một lần"
ui.screening.learn.visit.title: "Điều gì diễn ra khi khám"
ui.screening.learn.visit.lead: "Từ cửa vào đến lúc lấy mẫu, từng bước một."
ui.screening.learn.visit.before_title: "Trước khi đến khám"
ui.screening.learn.visit.before_body: "Hãy chuẩn bị:"
ui.screening.learn.visit.prep_form: "Điền phiếu sức khỏe gửi kèm thư."
ui.screening.learn.visit.prep_id: "Mang thẻ Kela hoặc giấy tờ tùy thân khác."
ui.screening.learn.visit.prep_period: "Không đến khi đang có kinh. Đổi lịch nếu cần."
ui.screening.learn.visit.prep_gel: "Không dùng thuốc hoặc gel âm đạo 1–2 ngày trước."
ui.screening.learn.visit.arrive_title: "Tại phòng xét nghiệm"
ui.screening.learn.visit.arrive_body: "Đăng ký tại quầy hoặc máy đăng ký. Y tá sẽ gọi bạn vào một phòng riêng. Toàn bộ buổi khám mất khoảng 10 phút."
ui.screening.learn.visit.arrive_badge: "10 phút"
ui.screening.learn.visit.sample_title: "Lấy mẫu"
ui.screening.learn.visit.sample_body: "Bạn cởi quần áo từ thắt lưng trở xuống và nằm lên giường khám. Bạn có thể giữ nguyên áo dài hoặc váy. Y tá nhẹ nhàng mở âm đạo bằng một dụng cụ nhỏ (mỏ vịt) và lấy tế bào bằng bàn chải mềm. Việc này mất vài phút."
ui.screening.learn.visit.feel_title: "Cảm giác thế nào"
ui.screening.learn.visit.feel_body: "Có thể hơi khó chịu một chút, nhưng không nên đau. Hãy thở chậm và thả lỏng chân. Nói với y tá nếu thấy đau. Bạn có thể xin tạm dừng."
ui.screening.learn.rights.title: "Quyền của bạn"
ui.screening.learn.rights.lead: "Bạn quyết định về cơ thể và buổi khám của mình."
ui.screening.learn.rights.intro_title: "Bạn quyết định"
ui.screening.learn.rights.intro_body: "Đây là quyền của bạn khi đi sàng lọc. Bạn có thể yêu cầu bất kỳ điều nào."
ui.screening.learn.rights.female: "Bạn có thể yêu cầu một người phụ nữ lấy mẫu. Hầu hết người lấy mẫu là phụ nữ."
ui.screening.learn.rights.interpreter: "Bạn có thể yêu cầu phiên dịch viên. Hãy nói ngôn ngữ của bạn khi gọi bộ phận chăm sóc khách hàng."
ui.screening.learn.rights.companion: "Bạn có thể đưa một người bạn tin tưởng đi cùng."
ui.screening.learn.rights.stop: "Bạn có thể yêu cầu y tá dừng lại hoặc tạm nghỉ bất cứ lúc nào."
ui.screening.learn.rights.choice: "Tham gia là miễn phí và do bạn lựa chọn. Bạn có thể đổi lịch hoặc từ chối."
ui.screening.learn.rights.private: "Nhân viên phải giữ bí mật thông tin của bạn."
ui.screening.learn.phrase.title: "Đưa cho nhân viên quầy xem"
ui.screening.learn.phrase.lead: "Những câu ngắn bằng tiếng Phần Lan. Đưa màn hình hoặc bấm phát."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "Tôi muốn một người phụ nữ lấy mẫu."
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "Tôi cần phiên dịch viên."
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "Tôi đang lo lắng. Bạn có thể làm chậm lại không?"
ui.screening.learn.after.title: "Sau khi khám"
ui.screening.learn.after.lead: "Khi nào có kết quả và kết quả nghĩa là gì."
ui.screening.learn.after.home_title: "Ngay sau khi khám"
ui.screening.learn.after.home_body: "Bạn có thể tiếp tục công việc ngay. Ra một chút máu lấm tấm là bình thường."
ui.screening.learn.after.results_title: "Kết quả gửi qua bưu điện"
ui.screening.learn.after.results_body: "Kết quả được gửi qua bưu điện hoặc OmaPosti trong khoảng hai tháng. Kết quả không hiển thị trên OmaKanta hoặc Maisa. Nếu sau ba tháng chưa nhận được gì, hãy gọi bộ phận chăm sóc khách hàng của phòng xét nghiệm."
ui.screening.learn.after.results_badge: "Khoảng 2 tháng"
ui.screening.learn.after.normal_title: "Kết quả bình thường"
ui.screening.learn.after.normal_body: "Bạn không cần làm gì thêm. Bạn sẽ nhận thư mời mới sau khoảng năm năm."
ui.screening.learn.after.more_title: "Nếu cần kiểm tra thêm"
ui.screening.learn.after.more_body: "Bạn sẽ nhận thư có hướng dẫn. Thay đổi nhẹ được kiểm tra lại bằng mẫu mới trong vòng hai năm. Các thay đổi khác được bác sĩ xem bằng dụng cụ phóng đại (soi cổ tử cung). Điều này không có nghĩa là bạn bị ung thư: thay đổi thường tự lành, phần còn lại dễ điều trị."
ui.screening.learn.faq.title: "Câu hỏi thường gặp"
ui.screening.learn.faq.lead: "Chạm vào câu hỏi để xem câu trả lời."
ui.screening.learn.faq.hurt_q: "Có đau không?"
ui.screening.learn.faq.hurt_a: "Thường là không. Có thể khó chịu trong chốc lát. Nói với y tá nếu đau, y tá sẽ dừng lại hoặc làm chậm hơn."
ui.screening.learn.faq.hpv_q: "Kết quả HPV dương tính có nghĩa là tôi bị ung thư không?"
ui.screening.learn.faq.hpv_a: "Không. HPV rất phổ biến và thường tự hết. Kết quả dương tính chỉ có nghĩa là bạn cần làm thêm một xét nghiệm."
ui.screening.learn.faq.period_q: "Tôi bắt đầu có kinh. Tôi phải làm gì?"
ui.screening.learn.faq.period_a: "Hãy đổi lịch. Không lấy mẫu khi đang có kinh. Các loại dịch tiết khác không sao."
ui.screening.learn.faq.pregnant_q: "Tôi đang mang thai hoặc cho con bú."
ui.screening.learn.faq.pregnant_a: "Thường bạn có thể tham gia đến tuần thứ 35 của thai kỳ và trong thời gian cho con bú. Sau khi sinh, hãy đợi đến khi hết sản dịch."
ui.screening.learn.faq.never_q: "Tôi chưa bao giờ quan hệ tình dục. Tôi có cần xét nghiệm không?"
ui.screening.learn.faq.never_a: "Nguy cơ của bạn rất thấp, vì HPV lây qua tiếp xúc tình dục. Bạn vẫn có thể tham gia: hãy nói với y tá, y tá có thể dùng mỏ vịt nhỏ. Bạn cũng có thể hủy lịch."
ui.screening.learn.faq.cutting_q: "Tôi đã bị cắt bộ phận sinh dục nữ. Tôi có thể tham gia không?"
ui.screening.learn.faq.cutting_a: "Có. Hãy nói với y tá trước khi lấy mẫu. Y tá có thể làm chậm và dùng mỏ vịt nhỏ hơn. Bạn cũng có thể xin gặp bác sĩ trước."
ui.screening.learn.faq.removed_q: "Tôi đã bị cắt bỏ tử cung."
ui.screening.learn.faq.removed_a: "Bạn vẫn nên đến. Khi đó mẫu được lấy từ âm đạo."
ui.screening.learn.faq.time_q: "Thời gian hẹn không phù hợp với tôi."
ui.screening.learn.faq.time_a: "Đổi trực tuyến bằng mã đặt lịch và mã PIN trong thư, hoặc gọi bộ phận chăm sóc khách hàng của phòng xét nghiệm. Bạn có thể chọn bất kỳ phòng xét nghiệm HUS nào có lấy mẫu sàng lọc."
ui.screening.learn.faq.letter_q: "Tôi làm mất thư, hoặc không bao giờ nhận được."
ui.screening.learn.faq.letter_a: "Hãy gọi bộ phận chăm sóc khách hàng của phòng xét nghiệm. Nếu không nhận được thư trong năm sàng lọc của bạn, bạn có thể tự đặt lịch."
ui.screening.learn.faq.cost_q: "Có mất phí không?"
ui.screening.learn.faq.cost_a: "Không. Sàng lọc miễn phí."

