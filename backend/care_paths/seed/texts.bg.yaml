ui.screening.letter.prepare_4: "Не използвайте вагинални супозитории или гелове 1–2 дни преди посещението."
ui.screening.letter.change_title: "Смяна или отказ на часа"
ui.screening.letter.change_body: "Ако часът не ви е удобен, сменете го онлайн с кода за резервация и PIN кода по-горе или се обадете на обслужването на клиенти на лабораторията. Ако не искате да участвате, моля, откажете часа, за да може някой друг да го използва."
ui.screening.letter.results_title: "Резултати"
ui.screening.letter.results_body: "Ще получите резултата по пощата или в OmaPosti в рамките на около два месеца. Ако е нормален, ще бъдете поканени отново след пет години. Ако са нужни още изследвания, ще получите указания и отделна покана."
