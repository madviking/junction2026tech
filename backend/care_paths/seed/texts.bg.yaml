ui.screening.learn.why.title: "Защо е важно"
ui.screening.learn.why.lead: "Кратко изследване, което ви пази с години."
ui.screening.learn.why.early_title: "Открива промените рано"
ui.screening.learn.why.early_body: "Ракът на шийката на матката расте бавно, в продължение на много години. Изследването открива клетъчни промени много преди те да се превърнат в рак. Ранните промени се лекуват лесно."
ui.screening.learn.why.no_symptoms_title: "Може да се чувствате добре и пак да имате нужда от него"
ui.screening.learn.why.no_symptoms_body: "HPV и ранните клетъчни промени не предизвикват симптоми. Затова изследването е за жени, които се чувстват здрави."
ui.screening.learn.why.hpv_title: "HPV е много често срещан"
ui.screening.learn.why.hpv_body: "Повечето хора се заразяват с HPV в някакъв момент от живота си. Обикновено той изчезва от само себе си. Наличието на HPV не е признак на изневяра и не казва нищо лошо за вас или за партньора ви."
ui.screening.learn.why.works_title: "Скринингът спасява животи"
ui.screening.learn.why.works_body: "Откакто скринингът започна във Финландия, ракът на шийката на матката стана много по-рядък. Участието всеки път, когато сте поканени, ви дава най-добра защита."
ui.screening.learn.why.works_badge: "На всеки 5 години"
ui.screening.learn.visit.title: "Какво се случва при посещението"
ui.screening.learn.visit.lead: "От вратата до пробата, стъпка по стъпка."
ui.screening.learn.visit.before_title: "Преди посещението"
ui.screening.learn.visit.before_body: "Пригответе следното:"
ui.screening.learn.visit.prep_form: "Попълнете здравния формуляр, който дойде с писмото."
ui.screening.learn.visit.prep_id: "Носете картата си от Kela или друг документ за самоличност."
ui.screening.learn.visit.prep_period: "Не по време на менструация. Сменете часа, ако е нужно."
ui.screening.learn.visit.prep_gel: "Без вагинални лекарства или гелове 1–2 дни преди това."
ui.screening.learn.visit.arrive_title: "В лабораторията"
ui.screening.learn.visit.arrive_body: "Регистрирайте се на гишето или на автомата за регистрация. Медицинска сестра ви вика в отделна стая. Цялото посещение отнема около 10 минути."
ui.screening.learn.visit.arrive_badge: "10 мин"
ui.screening.learn.visit.sample_title: "Вземане на пробата"
ui.screening.learn.visit.sample_body: "Събличате се от кръста надолу и лягате на кушетка за прегледи. Можете да останете с дълга блуза или пола. Медицинската сестра внимателно отваря влагалището с малък инструмент (спекулум) и взема клетки с мека четчица. Това отнема няколко минути."
ui.screening.learn.visit.feel_title: "Как се усеща"
ui.screening.learn.visit.feel_body: "Може да е малко неприятно, но не би трябвало да боли. Дишайте бавно и отпуснете краката си. Кажете на медицинската сестра, ако боли. Можете да поискате пауза."
ui.screening.learn.rights.title: "Вашите права"
ui.screening.learn.rights.lead: "Вие решавате за тялото си и за посещението си."
ui.screening.learn.rights.intro_title: "Вие решавате"
ui.screening.learn.rights.intro_body: "Това са вашите права при посещението за скрининг. Можете да поискате всяко от тях."
ui.screening.learn.rights.female: "Можете да поискате пробата да бъде взета от жена. Повечето, които вземат проби, са жени."
ui.screening.learn.rights.interpreter: "Можете да поискате преводач. Кажете езика си на обслужването на клиенти, когато се обаждате."
ui.screening.learn.rights.companion: "Можете да вземете със себе си човек, на когото имате доверие."
ui.screening.learn.rights.stop: "Можете да помолите медицинската сестра да спре или да направи пауза по всяко време."
ui.screening.learn.rights.choice: "Участието е безплатно и е ваш избор. Можете да смените часа или да откажете."
ui.screening.learn.rights.private: "Персоналът е длъжен да пази информацията ви поверителна."
ui.screening.learn.phrase.title: "Покажете това на гишето"
ui.screening.learn.phrase.lead: "Кратки изречения на фински. Покажете екрана или натиснете бутона за възпроизвеждане."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "Бих искала пробата да бъде взета от жена."
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "Имам нужда от преводач."
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "Притеснявам се. Бихте ли действали бавно?"
ui.screening.learn.after.title: "След посещението"
ui.screening.learn.after.lead: "Кога идва резултатът и какво означава."
ui.screening.learn.after.home_title: "Веднага след посещението"
ui.screening.learn.after.home_body: "Можете веднага да продължите деня си. Малко зацапване е нормално."
ui.screening.learn.after.results_title: "Резултатът идва по пощата"
ui.screening.learn.after.results_body: "Резултатът идва по пощата или в OmaPosti в рамките на около два месеца. Не се показва в OmaKanta или Maisa. Ако нищо не е дошло след три месеца, обадете се на обслужването на клиенти на лабораторията."
ui.screening.learn.after.results_badge: "Около 2 месеца"
ui.screening.learn.after.normal_title: "Нормален резултат"
ui.screening.learn.after.normal_body: "Няма какво повече да правите. Ще получите нова покана след около пет години."
ui.screening.learn.after.more_title: "Ако имате нужда от още изследвания"
ui.screening.learn.after.more_body: "Получавате писмо с указания. Малките промени се проверяват с нова проба до две години. Другите промени се преглеждат от лекар с увеличителен инструмент (колпоскопия). Това не означава, че имате рак: промените често отшумяват от само себе си, а останалите се лекуват лесно."
ui.screening.learn.faq.title: "Чести въпроси"
ui.screening.learn.faq.lead: "Докоснете въпрос, за да видите отговора."
ui.screening.learn.faq.hurt_q: "Боли ли?"
ui.screening.learn.faq.hurt_a: "Обикновено не. За момент може да е неприятно. Кажете на медицинската сестра, ако боли, и тя ще спре или ще действа по-бавно."
ui.screening.learn.faq.hpv_q: "Положителен резултат за HPV означава ли, че имам рак?"
ui.screening.learn.faq.hpv_a: "Не. HPV е много често срещан и обикновено изчезва от само себе си. Положителният резултат означава само, че имате нужда от още едно изследване."
ui.screening.learn.faq.period_q: "Менструацията ми започна. Какво да правя?"
ui.screening.learn.faq.period_a: "Сменете часа си. Пробата не се взема по време на менструация. Другото течение не е проблем."
ui.screening.learn.faq.pregnant_q: "Бременна съм или кърмя."
ui.screening.learn.faq.pregnant_a: "Обикновено можете да участвате до 35-ата седмица от бременността и докато кърмите. След раждане изчакайте, докато кървенето спре."
ui.screening.learn.faq.never_q: "Никога не съм имала полов контакт. Трябва ли ми изследването?"
ui.screening.learn.faq.never_a: "Рискът ви е много нисък, защото HPV се предава при полов контакт. Все пак можете да участвате: кажете на медицинската сестра, която може да използва малък спекулум. Можете и да откажете часа."
ui.screening.learn.faq.cutting_q: "Претърпяла съм обрязване (женско генитално осакатяване). Мога ли да участвам?"
ui.screening.learn.faq.cutting_a: "Да. Кажете на медицинската сестра преди вземането на пробата. Тя може да действа бавно и да използва по-малък спекулум. Можете също първо да поискате час при лекар."
ui.screening.learn.faq.removed_q: "Матката ми е отстранена."
ui.screening.learn.faq.removed_a: "Все пак елате. Тогава пробата се взема от влагалището."
ui.screening.learn.faq.time_q: "Часът не ми е удобен."
ui.screening.learn.faq.time_a: "Сменете го онлайн с кода за резервация и PIN кода от писмото или се обадете на обслужването на клиенти на лабораторията. Можете да изберете всяка лаборатория на HUS, която взема проби за скрининг."
ui.screening.learn.faq.letter_q: "Изгубих писмото си или то така и не дойде."
ui.screening.learn.faq.letter_a: "Обадете се на обслужването на клиенти на лабораторията. Ако в годината на скрининга ви не е дошло писмо, можете сами да си запишете час."
ui.screening.learn.faq.cost_q: "Струва ли нещо?"
ui.screening.learn.faq.cost_a: "Не. Скринингът е безплатен."
