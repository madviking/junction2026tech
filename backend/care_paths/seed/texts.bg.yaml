lane.U0.name: "Спешен случай"
lane.U0.trigger: "Силно кървене, силен задух, внезапна слабост, обърканост, болка в гърдите"
lane.U0.tone: "Един екран, едно действие"
lane.U1.name: "Същия ден"
lane.U1.trigger: "Нова силна болка, повръщане на кръв, висока температура по време на лечение на рак"
lane.U1.tone: "Спокойно и директно"
lane.U2.name: "Тревожен симптом"
lane.U2.trigger: "Бучка, необяснимо кървене, кръв в изпражненията, кашлица над 3 седмици със загуба на тегло, кървене след менопауза, променяща се бенка"
lane.U2.tone: "Сериозно, но не плашещо; без назоваване на диагноза"
lane.U3.name: "Продължителни неясни оплаквания"
lane.U3.trigger: "Умора, неясна болка, липса на апетит от седмици"
lane.U3.tone: "Успокояващо, с ясни правила кога да се върнете"
lane.U4.name: "Скрининг"
lane.U4.trigger: "Писмо с покана, пропуснат скрининг, положителен резултат"
lane.U4.tone: "Обяснете какво означава писмото"
lane.U5.name: "В застой"
lane.U5.trigger: "Изпратено направление без писмо, липсващ резултат, късно започване на лечението"
lane.U5.tone: "Практично, въз основа на правата ви"
