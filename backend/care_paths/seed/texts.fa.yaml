lane.U0.name: "اورژانس"
lane.U0.trigger: "خونریزی شدید، تنگی نفس شدید، ضعف ناگهانی، گیجی، درد قفسه سینه"
lane.U0.tone: "یک صفحه، یک اقدام"
lane.U1.name: "همان روز"
lane.U1.trigger: "درد شدید تازه، استفراغ خون، تب بالا در دوران درمان سرطان"
lane.U1.tone: "آرام و مستقیم"
lane.U2.name: "نشانه هشداردهنده"
lane.U2.trigger: "توده یا برآمدگی، خونریزی بدون علت، خون در مدفوع، سرفه بیش از ۳ هفته همراه با کاهش وزن، خونریزی پس از یائسگی، خال در حال تغییر"
lane.U2.tone: "جدی، اما نه ترسناک؛ بدون نام بردن از هیچ بیماری"
lane.U3.name: "نشانه ادامه‌دار و نامشخص"
lane.U3.trigger: "خستگی، درد مبهم، بی‌اشتهایی در طول چند هفته"
lane.U3.tone: "اطمینان‌بخش، با قاعده‌های روشن برای بازگشت"
lane.U4.name: "غربالگری"
lane.U4.trigger: "نامه دعوت، غربالگری از دست رفته، نتیجه مثبت"
lane.U4.tone: "توضیح اینکه نامه چه معنایی دارد"
lane.U5.name: "متوقف‌مانده"
lane.U5.trigger: "ارجاع فرستاده شده و نامه‌ای نیامده، نتیجه گم شده، شروع دیرهنگام درمان"
lane.U5.tone: "عملی، بر پایه حقوق شما"
