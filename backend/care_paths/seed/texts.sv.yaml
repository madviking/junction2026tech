ui.screening.letter.intro: "Du kallas till screening för livmoderhalscancer. Alla kvinnor i åldern 25–65 år som bor i Helsingfors kallas vart femte år. Screeningen är avgiftsfri och frivillig. Vi har bokat en tid åt dig."
