ui.screening.learn.to_letter: "Titta på brevet igen"
ui.screening.learn.to_silta: "Andra hälsobekymmer: gå till Silta"
ui.screening.learn.restart: "Börja om guiden"
ui.screening.learn.why.title: "Varför det är viktigt"
ui.screening.learn.why.lead: "Ett kort test som skyddar dig i flera år."
ui.screening.learn.why.early_title: "Det hittar förändringar tidigt"
ui.screening.learn.why.early_body: "Livmoderhalscancer växer långsamt, under många år. Testet hittar cellförändringar långt innan de blir cancer. Tidiga förändringar är lätta att behandla."
ui.screening.learn.why.no_symptoms_title: "Du kan må bra och ändå behöva det"
ui.screening.learn.why.no_symptoms_body: "HPV och tidiga cellförändringar ger inga symtom. Därför är testet till för kvinnor som mår bra."
ui.screening.learn.why.hpv_title: "HPV är mycket vanligt"
ui.screening.learn.why.hpv_body: "De flesta får HPV någon gång i livet. Det försvinner oftast av sig självt. HPV är inget tecken på otrohet och säger inget dåligt om dig eller din partner."
ui.screening.learn.why.works_title: "Screening räddar liv"
ui.screening.learn.why.works_body: "Sedan screeningen började i Finland har livmoderhalscancer blivit mycket ovanligare. Bäst skydd får du om du deltar varje gång du kallas."
ui.screening.learn.why.works_badge: "Vart 5:e år"
ui.screening.learn.visit.title: "Vad händer vid besöket"
ui.screening.learn.visit.lead: "Från dörren till provet, steg för steg."
ui.screening.learn.visit.before_title: "Före besöket"
ui.screening.learn.visit.before_body: "Förbered detta:"
ui.screening.learn.visit.prep_form: "Fyll i förhandsblanketten som kom med brevet."
ui.screening.learn.visit.prep_id: "Ta med FPA-kortet eller annan legitimation."
ui.screening.learn.visit.prep_period: "Inte under mens. Byt tid vid behov."
ui.screening.learn.visit.prep_gel: "Inga vaginala läkemedel eller geler 1–2 dagar innan."
ui.screening.learn.visit.arrive_title: "På laboratoriet"
ui.screening.learn.visit.arrive_body: "Anmäl dig vid disken eller i automaten. En skötare ropar in dig till ett eget rum. Hela besöket tar cirka 10 minuter."
ui.screening.learn.visit.arrive_badge: "10 min"
ui.screening.learn.visit.sample_title: "Provtagningen"
ui.screening.learn.visit.sample_body: "Du klär av dig från midjan och nedåt och lägger dig på en undersökningsbrits. En lång tröja eller kjol kan du ha kvar. Skötaren öppnar slidan försiktigt med ett litet instrument (spekulum) och tar celler med en mjuk borste. Det tar ett par minuter."
ui.screening.learn.visit.feel_title: "Hur det känns"
ui.screening.learn.visit.feel_body: "Det kan kännas lite obehagligt, men det ska inte göra ont. Andas lugnt och slappna av i benen. Säg till om det gör ont. Du kan be om en paus."
ui.screening.learn.rights.title: "Dina rättigheter"
ui.screening.learn.rights.lead: "Du bestämmer över din kropp och ditt besök."
ui.screening.learn.rights.intro_title: "Du bestämmer"
ui.screening.learn.rights.intro_body: "Det här är dina rättigheter vid screeningbesöket. Du kan be om vilken som helst av dem."
ui.screening.learn.rights.female: "Du kan be att en kvinna tar provet. De flesta provtagare är kvinnor."
ui.screening.learn.rights.interpreter: "Du kan be om tolk. Säg ditt språk när du ringer kundtjänsten."
ui.screening.learn.rights.companion: "Du kan ta med en person du litar på."
ui.screening.learn.rights.stop: "Du kan be skötaren sluta eller ta paus när som helst."
ui.screening.learn.rights.choice: "Det är avgiftsfritt och ditt eget val att delta. Du kan byta tid eller tacka nej."
ui.screening.learn.rights.private: "Personalen har tystnadsplikt om dina uppgifter."
ui.screening.learn.phrase.title: "Visa detta vid disken"
ui.screening.learn.phrase.lead: "Korta meningar på finska. Visa skärmen eller tryck på spela."
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "Jag vill gärna att en kvinna tar provet."
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "Jag behöver en tolk."
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "Jag är nervös. Kan du gå långsamt fram?"
ui.screening.learn.after.title: "Efter besöket"
ui.screening.learn.after.lead: "När resultatet kommer och vad det betyder."
ui.screening.learn.after.home_title: "Direkt efter besöket"
ui.screening.learn.after.home_body: "Du kan fortsätta din dag direkt. Lite stänkblödning är normalt."
ui.screening.learn.after.results_title: "Resultatet kommer per post"
ui.screening.learn.after.results_body: "Resultatet kommer per post eller till OmaPosti inom cirka två månader. Det syns inte i Mina Kanta-sidor eller Maisa. Om inget har kommit efter tre månader, ring laboratoriets kundtjänst."
ui.screening.learn.after.results_badge: "Cirka 2 mån"
ui.screening.learn.after.normal_title: "Normalt resultat"
ui.screening.learn.after.normal_body: "Du behöver inte göra något mer. Du får en ny kallelse om cirka fem år."
ui.screening.learn.after.more_title: "Om du behöver fler undersökningar"
ui.screening.learn.after.more_body: "Du får ett brev med anvisningar. Lindriga förändringar kontrolleras med ett nytt prov inom två år. Andra förändringar undersöks av en läkare med ett förstorande instrument (kolposkopi). Det betyder inte att du har cancer: förändringar läker ofta av sig själva, och resten är lätta att behandla."
ui.screening.learn.faq.title: "Vanliga frågor"
ui.screening.learn.faq.lead: "Tryck på en fråga för att se svaret."
ui.screening.learn.faq.hurt_q: "Gör det ont?"
ui.screening.learn.faq.hurt_a: "Oftast inte. Det kan kännas obehagligt en stund. Säg till skötaren om det gör ont, så stannar skötaren eller går långsammare fram."
ui.screening.learn.faq.hpv_q: "Betyder ett positivt HPV-resultat att jag har cancer?"
ui.screening.learn.faq.hpv_a: "Nej. HPV är mycket vanligt och försvinner oftast av sig självt. Ett positivt resultat betyder bara att du behöver en ny undersökning."
ui.screening.learn.faq.period_q: "Min mens började. Vad gör jag?"
ui.screening.learn.faq.period_a: "Byt tid. Provet tas inte under mens. Andra flytningar är inget problem."
ui.screening.learn.faq.pregnant_q: "Jag är gravid eller ammar."
ui.screening.learn.faq.pregnant_a: "Du kan oftast delta fram till graviditetsvecka 35 och medan du ammar. Efter förlossningen, vänta tills avslagsblödningen har upphört."
ui.screening.learn.faq.never_q: "Jag har aldrig haft samlag. Behöver jag testet?"
ui.screening.learn.faq.never_a: "Din risk är mycket liten, eftersom HPV smittar vid sexuell kontakt. Du kan ändå delta: säg till skötaren, som kan använda ett litet spekulum. Du kan också avboka tiden."
ui.screening.learn.faq.cutting_q: "Jag är omskuren (könsstympning). Kan jag delta?"
ui.screening.learn.faq.cutting_a: "Ja. Berätta för skötaren före provtagningen. Skötaren kan gå långsamt fram och använda ett mindre spekulum. Du kan också först be om en läkartid."
ui.screening.learn.faq.removed_q: "Min livmoder har tagits bort."
ui.screening.learn.faq.removed_a: "Kom ändå. Provet tas då från slidan."
ui.screening.learn.faq.time_q: "Tiden passar mig inte."
ui.screening.learn.faq.time_a: "Byt den på nätet med bokningskoden och PIN-koden i brevet, eller ring laboratoriets kundtjänst. Du kan välja vilket HUS-laboratorium som helst som tar screeningprov."
ui.screening.learn.faq.letter_q: "Jag tappade bort brevet, eller så kom det aldrig."
ui.screening.learn.faq.letter_a: "Ring laboratoriets kundtjänst. Om inget brev kom under ditt screeningår kan du boka en tid själv."
ui.screening.learn.faq.cost_q: "Kostar det något?"
ui.screening.learn.faq.cost_a: "Nej. Screeningen är avgiftsfri."

