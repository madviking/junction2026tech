ui.screening.letter.what_body: "En skötare tar ett litet cellprov från livmodertappen med en mjuk borste. Provtagningen tar ett par minuter. Om du är 30 år eller äldre testas provet för HPV, viruset bakom nästan all livmoderhalscancer. Om du är under 30 år görs ett cellprov (papa-prov)."
ui.screening.letter.prepare_title: "Före besöket"
ui.screening.letter.prepare_1: "Fyll i den bifogade förhandsblanketten och ta den med dig."
ui.screening.letter.prepare_2: "Ta med FPA-kortet eller annan legitimation."
ui.screening.letter.prepare_3: "Provet tas inte under mens. Om du har mens den dagen, byt tid."
ui.screening.letter.prepare_4: "Använd inte vaginala stolpiller eller geler 1–2 dagar före besöket."
ui.screening.letter.change_title: "Byta eller avboka tiden"
ui.screening.letter.change_body: "Om tiden inte passar, byt den på nätet med bokningskoden och PIN-koden ovan, eller ring laboratoriets kundtjänst. Om du inte vill delta, avboka tiden så att någon annan kan använda den."
ui.screening.letter.results_title: "Resultat"
ui.screening.letter.results_body: "Du får resultatet per post eller i OmaPosti inom cirka två månader. Om det är normalt kallas du igen om fem år. Om fler undersökningar behövs får du anvisningar och en separat kallelse."
