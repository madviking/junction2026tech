ui.about.who.text:
  en: "Silta is a prototype built by a team at the Junction 2026 hackathon. It is not an official service of a wellbeing services county."
  fi: "Silta on Junction 2026 -hackathonissa rakennettu prototyyppi. Se ei ole hyvinvointialueen virallinen palvelu."
  sv: "Silta är en prototyp som ett team har byggt på hackathonet Junction 2026. Den är inte en officiell tjänst från ett välfärdsområde."
  ru: "Silta — это прототип, созданный командой на хакатоне Junction 2026. Это не официальная услуга региона благосостояния."
  et: "Silta on prototüüp, mille meeskond ehitas Junction 2026 häkatonil. See ei ole heaolupiirkonna ametlik teenus."
  uk: "Silta — це прототип, створений командою на хакатоні Junction 2026. Це не офіційна послуга регіону добробуту."
  so: "Silta waa tijaabo ay koox ku dhistay tartanka hackathon-ka Junction 2026. Ma aha adeeg rasmi ah oo ka tirsan gobol daryeel bulsho."
  ar: "سيلتا نموذج أولي بناه فريق في هاكاثون Junction 2026. ليست خدمة رسمية تابعة لمنطقة خدمات الرفاه."
  fa: "Silta یک نمونه اولیه است که یک تیم در هکاتون Junction 2026 ساخته است. این یک خدمت رسمی منطقه خدمات رفاهی نیست."
  zh: "Silta 是一个团队在 Junction 2026 黑客松上开发的原型，不是福利服务区的官方服务。"
  yue: "Silta 係一個團隊喺 Junction 2026 黑客松開發嘅原型，唔係福利服務區嘅官方服務。"
  vi: "Silta là một bản mẫu do một nhóm xây dựng tại cuộc thi hackathon Junction 2026. Đây không phải là dịch vụ chính thức của một vùng dịch vụ phúc lợi."
  th: "Silta เป็นต้นแบบที่ทีมหนึ่งสร้างขึ้นในงานแฮกกาธอน Junction 2026 ไม่ใช่บริการอย่างเป็นทางการของเขตบริการสวัสดิการ"
