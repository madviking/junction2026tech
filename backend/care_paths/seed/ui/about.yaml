ui.about.what.text:
  en: "Silta helps you find the right place for care in Finland, gives you the words to say in Finnish, and helps you follow up until you get an answer."
  fi: "Silta auttaa löytämään oikean hoitopaikan Suomessa, antaa sanat suomeksi ja auttaa seuraamaan asiaa, kunnes saat vastauksen."
  sv: "Silta hjälper dig att hitta rätt vårdplats i Finland, ger dig orden att säga på finska och hjälper dig att följa upp tills du får ett svar."
  ru: "Silta помогает найти нужное место для получения медицинской помощи в Финляндии, подсказывает, что сказать по-фински, и помогает следить за делом, пока вы не получите ответ."
  et: "Silta aitab leida Soomes õige ravikoha, annab sõnad, mida soome keeles öelda, ja aitab asja jälgida, kuni saad vastuse."
  uk: "Silta допомагає знайти потрібне місце для отримання медичної допомоги у Фінляндії, підказує, що сказати фінською, і допомагає стежити за справою, доки ви не отримаєте відповідь."
  so: "Silta waxay kaa caawinaysaa inaad hesho meesha saxda ah ee daryeelka Finland, waxay ku siinaysaa erayada aad Finnish ku dhahayso, waxayna kaa caawinaysaa inaad la socoto ilaa aad jawaab ka hesho."
  ar: "تساعدك سيلتا على إيجاد المكان المناسب للرعاية في فنلندا، وتعطيك الكلمات التي تقولها بالفنلندية، وتساعدك على المتابعة حتى تحصل على جواب."
  fa: "Silta به شما کمک می‌کند جای درست برای مراقبت درمانی در فنلاند را پیدا کنید، جمله‌هایی را که باید به فنلاندی بگویید به شما می‌دهد و کمک می‌کند تا گرفتن پاسخ، کار را پیگیری کنید."
  zh: "Silta 帮助您在芬兰找到合适的就医地点，告诉您用芬兰语该怎么说，并帮助您跟进，直到得到答复。"
  yue: "Silta 幫你喺芬蘭搵到啱嘅求醫地方，話你知用芬蘭文點講，仲會幫你跟進，直到你得到答覆。"
  vi: "Silta giúp bạn tìm đúng nơi khám chữa bệnh ở Phần Lan, cho bạn những câu cần nói bằng tiếng Phần Lan và giúp bạn theo dõi cho đến khi có câu trả lời."
  th: "Silta ช่วยคุณหาสถานที่รับการรักษาที่เหมาะสมในฟินแลนด์ ให้คำพูดที่ต้องใช้เป็นภาษาฟินแลนด์ และช่วยติดตามเรื่องจนกว่าคุณจะได้รับคำตอบ"
