ui.about.not.text:
  en: "Silta is not a doctor and does not diagnose. A nurse or doctor decides how urgent your situation is. In an emergency, call 112."
  fi: "Silta ei ole lääkäri eikä tee diagnooseja. Hoitaja tai lääkäri arvioi, kuinka kiireellinen tilanteesi on. Hätätilanteessa soita 112."
  sv: "Silta är inte en läkare och ställer inga diagnoser. En sjukskötare eller läkare bedömer hur brådskande din situation är. Ring 112 i en nödsituation."
  ru: "Silta не врач и не ставит диагнозы. Насколько срочна ваша ситуация, решает медсестра или врач. В экстренной ситуации звоните 112."
  et: "Silta ei ole arst ega pane diagnoose. Õde või arst hindab, kui kiire sinu olukord on. Hädaolukorras helista 112."
  uk: "Silta не лікар і не ставить діагнозів. Наскільки термінова ваша ситуація, вирішує медсестра або лікар. В екстреній ситуації телефонуйте 112."
  so: "Silta ma aha dhakhtar, cudurna ma ogaato. Kalkaaliye ama dhakhtar ayaa go'aaminaya sida ay xaaladdaadu degdeg u tahay. Xaalad degdeg ah, wac 112."
  ar: "سيلتا ليست طبيباً ولا تشخّص الأمراض. الممرض أو الطبيب هو من يقرر مدى استعجال حالتك. في حالة الطوارئ اتصل بالرقم 112."
  fa: "Silta پزشک نیست و تشخیص نمی‌دهد. پرستار یا پزشک تصمیم می‌گیرد وضعیت شما چقدر فوری است. در وضعیت اضطراری با ۱۱۲ تماس بگیرید."
  zh: "Silta 不是医生，也不做诊断。您的情况有多紧急，由护士或医生判断。遇到紧急情况，请拨打 112。"
  yue: "Silta 唔係醫生，亦唔會做診斷。你嘅情況有幾緊急，由護士或者醫生判斷。遇到緊急情況，請打 112。"
  vi: "Silta không phải là bác sĩ và không chẩn đoán bệnh. Y tá hoặc bác sĩ sẽ quyết định tình trạng của bạn khẩn cấp đến mức nào. Trong trường hợp khẩn cấp, hãy gọi 112."
  th: "Silta ไม่ใช่แพทย์และไม่วินิจฉัยโรค พยาบาลหรือแพทย์เป็นผู้ตัดสินว่าอาการของคุณเร่งด่วนแค่ไหน ในกรณีฉุกเฉิน โทร 112"
ui.about.privacy.title:
  en: "Your privacy"
  fi: "Yksityisyytesi"
  sv: "Din integritet"
  ru: "Ваша конфиденциальность"
  et: "Sinu privaatsus"
  uk: "Ваша конфіденційність"
  so: "Asturnaantaada"
  ar: "خصوصيتك"
  fa: "حریم خصوصی شما"
  zh: "您的隐私"
  yue: "你嘅私隱"
  vi: "Quyền riêng tư của bạn"
  th: "ความเป็นส่วนตัวของคุณ"
ui.about.privacy.text:
  en: "Silta does not ask for your name, identity number or address. Your answers are saved under an anonymous code, and only someone with the code can see them. You can delete them at any time from your visit card."
  fi: "Silta ei kysy nimeäsi, henkilötunnustasi eikä osoitettasi. Vastauksesi tallennetaan nimettömän koodin alle, ja ne näkee vain se, jolla on koodi. Voit poistaa ne milloin tahansa käyntikortistasi."
  sv: "Silta frågar inte efter ditt namn, din personbeteckning eller din adress. Dina svar sparas under en anonym kod, och bara den som har koden kan se dem. Du kan radera dem när som helst från ditt besökskort."
  ru: "Silta не спрашивает ваше имя, личный код или адрес. Ваши ответы сохраняются под анонимным кодом, и увидеть их может только тот, у кого есть код. Вы можете удалить их в любое время в своей карточке визита."
  et: "Silta ei küsi sinu nime, isikukoodi ega aadressi. Sinu vastused salvestatakse anonüümse koodi alla ja neid näeb ainult see, kellel on kood. Saad need igal ajal oma visiidikaardilt kustutada."
  uk: "Silta не запитує ваше ім'я, особистий код чи адресу. Ваші відповіді зберігаються під анонімним кодом, і побачити їх може лише той, хто має код. Ви можете будь-коли видалити їх у своїй картці візиту."
  so: "Silta ma weydiiso magacaaga, lambarkaaga aqoonsiga ama cinwaankaaga. Jawaabahaaga waxaa lagu kaydiyaa kood qarsoodi ah, waxaana arki kara oo keliya qofka haysta koodka. Waxaad ka tirtiri kartaa wakhti kasta kaarkaaga booqashada."
  ar: "لا تطلب سيلتا اسمك أو رقم هويتك أو عنوانك. تُحفظ إجاباتك تحت رمز مجهول، ولا يراها إلا من لديه الرمز. يمكنك حذفها في أي وقت من بطاقة زيارتك."
  fa: "Silta نام، شماره هویت یا نشانی شما را نمی‌پرسد. پاسخ‌های شما زیر یک کد ناشناس ذخیره می‌شود و فقط کسی که کد را دارد می‌تواند آن‌ها را ببیند. هر زمان بخواهید می‌توانید آن‌ها را از کارت ویزیت خود پاک کنید."
  zh: "Silta 不会询问您的姓名、身份号码或地址。您的回答保存在一个匿名代码下，只有持有该代码的人才能看到。您可以随时在就诊卡中删除这些回答。"
  yue: "Silta 唔會問你嘅姓名、身份號碼或者地址。你嘅回答會儲存喺一個匿名代碼之下，只有有呢個代碼嘅人先睇到。你可以隨時喺就診卡度刪除。"
  vi: "Silta không hỏi tên, số định danh hay địa chỉ của bạn. Các câu trả lời của bạn được lưu dưới một mã ẩn danh và chỉ người có mã mới xem được. Bạn có thể xóa chúng bất cứ lúc nào từ thẻ khám của mình."
  th: "Silta ไม่ถามชื่อ เลขประจำตัว หรือที่อยู่ของคุณ คำตอบของคุณถูกบันทึกไว้ภายใต้รหัสที่ไม่ระบุตัวตน และมีเพียงผู้ที่มีรหัสเท่านั้นที่เห็นได้ คุณลบคำตอบได้ทุกเมื่อจากบัตรเข้าพบของคุณ"
ui.about.words.title:
  en: "When you type or speak"
  fi: "Kun kirjoitat tai puhut"
  sv: "När du skriver eller talar"
  ru: "Когда вы пишете или говорите"
  et: "Kui kirjutad või räägid"
  uk: "Коли ви пишете або говорите"
  so: "Markaad wax qorto ama hadasho"
  ar: "عندما تكتب أو تتحدث"
  fa: "وقتی می‌نویسید یا صحبت می‌کنید"
  zh: "当您输入或说话时"
  yue: "當你打字或者講嘢嘅時候"
  vi: "Khi bạn gõ hoặc nói"
  th: "เมื่อคุณพิมพ์หรือพูด"
ui.about.words.text:
  en: "An AI service matches your words to one of the cards and asks you to confirm. It never chooses for you and never decides where you go. Silta does not save your voice recording."
  fi: "Tekoälypalvelu yhdistää sanasi johonkin korteista ja pyytää sinua vahvistamaan. Se ei koskaan valitse puolestasi eikä päätä, minne menet. Silta ei tallenna äänitallennettasi."
  sv: "En AI-tjänst kopplar dina ord till ett av korten och ber dig bekräfta. Den väljer aldrig åt dig och bestämmer aldrig vart du ska gå. Silta sparar inte din röstinspelning."
  ru: "Сервис искусственного интеллекта сопоставляет ваши слова с одной из карточек и просит вас подтвердить. Он никогда не выбирает за вас и не решает, куда вам идти. Silta не сохраняет вашу голосовую запись."
  et: "Tehisintellekti teenus seob sinu sõnad ühe kaardiga ja palub sul kinnitada. See ei vali kunagi sinu eest ega otsusta, kuhu sa lähed. Silta ei salvesta sinu häälsalvestist."
  uk: "Сервіс штучного інтелекту зіставляє ваші слова з однією з карток і просить вас підтвердити. Він ніколи не обирає за вас і не вирішує, куди вам іти. Silta не зберігає ваш голосовий запис."
  so: "Adeeg AI ah ayaa erayadaada la jaanqaadaya mid ka mid ah kaararka, wuxuuna ku weydiinayaa inaad xaqiijiso. Marnaba adiga kuuma doorto, mana go'aamiyo meesha aad aadayso. Silta ma kaydiso duubista codkaaga."
  ar: "تطابق خدمة ذكاء اصطناعي كلماتك مع إحدى البطاقات وتطلب منك التأكيد. لا تختار عنك أبداً ولا تقرر أين تذهب. لا تحفظ سيلتا تسجيلك الصوتي."
  fa: "یک سرویس هوش مصنوعی گفته‌های شما را با یکی از کارت‌ها تطبیق می‌دهد و از شما می‌خواهد تأیید کنید. هرگز به جای شما انتخاب نمی‌کند و تصمیم نمی‌گیرد کجا بروید. Silta صدای ضبط‌شده شما را ذخیره نمی‌کند."
  zh: "人工智能服务会把您的话与其中一张卡片匹配，并请您确认。它绝不会替您选择，也不会决定您去哪里。Silta 不保存您的录音。"
  yue: "人工智能服務會將你講嘅說話配對其中一張卡，再請你確認。佢絕對唔會幫你揀，亦唔會決定你去邊度。Silta 唔會儲存你嘅錄音。"
  vi: "Một dịch vụ AI đối chiếu lời của bạn với một trong các thẻ và hỏi bạn xác nhận. Nó không bao giờ chọn thay bạn và không bao giờ quyết định bạn đi đâu. Silta không lưu bản ghi âm giọng nói của bạn."
  th: "บริการ AI จะจับคู่คำพูดของคุณกับการ์ดใบหนึ่งและขอให้คุณยืนยัน บริการนี้ไม่เลือกแทนคุณและไม่ตัดสินว่าคุณจะไปที่ไหน Silta ไม่บันทึกเสียงที่คุณอัดไว้"
ui.about.facts.title:
  en: "Where the information comes from"
  fi: "Mistä tiedot tulevat"
  sv: "Varifrån informationen kommer"
  ru: "Откуда берётся информация"
  et: "Kust teave pärineb"
  uk: "Звідки береться інформація"
  so: "Halka ay macluumaadku ka yimaadaan"
  ar: "من أين تأتي المعلومات"
  fa: "اطلاعات از کجا می‌آید"
  zh: "信息来源"
  yue: "資料來源"
  vi: "Thông tin đến từ đâu"
  th: "ข้อมูลมาจากไหน"
ui.about.facts.text:
  en: "Time limits marked \"By law\" come from Finnish health care law. Other limits are marked as recommendations. Translations that have not been checked yet are marked."
  fi: "Merkinnällä \"Laki\" näytetyt aikarajat tulevat Suomen terveydenhuoltolainsäädännöstä. Muut aikarajat on merkitty suosituksiksi. Käännökset, joita ei ole vielä tarkistettu, on merkitty."
  sv: "Tidsgränser som är märkta som lagstadgade kommer från Finlands hälso- och sjukvårdslagstiftning. Andra tidsgränser är märkta som rekommendationer. Översättningar som ännu inte har granskats är märkta."
  ru: "Сроки с пометкой о законе взяты из финского законодательства о здравоохранении. Остальные сроки помечены как рекомендации. Переводы, которые ещё не проверены, помечены."
  et: "Seaduse märkega tähtajad pärinevad Soome tervishoiuseadustest. Muud tähtajad on märgitud soovitustena. Tõlked, mida ei ole veel kontrollitud, on märgistatud."
  uk: "Строки з позначкою про закон узято з фінського законодавства про охорону здоров'я. Інші строки позначено як рекомендації. Переклади, які ще не перевірено, позначено."
  so: "Xadadka waqtiga ee lagu calaamadeeyay sharci ahaan waxay ka yimaadaan sharciga daryeelka caafimaadka Finland. Xadadka kale waxaa loo calaamadeeyay talooyin. Tarjumaadaha aan weli la hubin waa la calaamadeeyay."
  ar: "المهل الزمنية المعلَّمة بأنها بموجب القانون مأخوذة من قانون الرعاية الصحية الفنلندي. المهل الأخرى معلَّمة كتوصيات. الترجمات التي لم تُراجَع بعد معلَّمة."
  fa: "مهلت‌هایی که با نشان قانون مشخص شده‌اند از قانون مراقبت‌های بهداشتی فنلاند گرفته شده‌اند. مهلت‌های دیگر به‌عنوان توصیه مشخص شده‌اند. ترجمه‌هایی که هنوز بازبینی نشده‌اند علامت‌گذاری شده‌اند."
  zh: "标有依法字样的时限来自芬兰医疗保健法律。其他时限标为建议。尚未审核的翻译会有标注。"
  yue: "標明依法嘅時限來自芬蘭醫療保健法例。其他時限標明為建議。未經審核嘅翻譯會有標註。"
  vi: "Các thời hạn được đánh dấu là theo luật lấy từ luật chăm sóc sức khỏe của Phần Lan. Các thời hạn khác được đánh dấu là khuyến nghị. Những bản dịch chưa được kiểm tra đều được đánh dấu."
  th: "กำหนดเวลาที่ระบุว่าเป็นไปตามกฎหมายมาจากกฎหมายการดูแลสุขภาพของฟินแลนด์ กำหนดเวลาอื่นระบุว่าเป็นคำแนะนำ คำแปลที่ยังไม่ได้ตรวจสอบจะมีเครื่องหมายกำกับไว้"
