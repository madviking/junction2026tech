# The phone-call script around the lane's Finnish request (care_paths/domain/compose.ts,
# callScript). The Finnish text is what the person says or hears; every other language is
# its meaning. All 14 languages live here; only en and fi are checked.
# {language} = the person's language (Finnish name in fi, the language's own name elsewhere).

step.call.greeting:
  en: "Hello. I am calling because I need help with a health matter."
  fi: "Hei. Soitan, koska tarvitsen apua terveysasiassa."
  sv: "Hej. Jag ringer för att jag behöver hjälp med en hälsofråga."
  ru: "Здравствуйте. Я звоню, потому что мне нужна помощь по вопросу здоровья."
  et: "Tere. Helistan, sest vajan abi terviseküsimuses."
  uk: "Добрий день. Я телефоную, бо мені потрібна допомога щодо здоров’я."
  ar: "مرحبًا. أتصل لأنني أحتاج إلى مساعدة في أمر صحي."
  so: "Haye. Waxaan u soo wacayaa sababtoo ah waxaan u baahanahay caawimaad caafimaad."
  fa: "سلام. تماس می‌گیرم چون در یک موضوع سلامتی به کمک نیاز دارم."
  zh: "您好。我打电话是因为我有健康方面的问题需要帮助。"
  yue: "你好。我打嚟係因為我有健康問題需要幫助。"
  vi: "Xin chào. Tôi gọi vì tôi cần giúp đỡ về một vấn đề sức khỏe."
  th: "สวัสดีค่ะ/ครับ ฉันโทรมาเพราะต้องการความช่วยเหลือเรื่องสุขภาพ"
  bg: "Здравейте. Обаждам се, защото имам нужда от помощ за здравословен проблем."
step.call.interpreter:
  en: "I speak only a little Finnish. I need an interpreter."
  fi: "Puhun vain vähän suomea. Tarvitsen tulkin."
  sv: "Jag talar bara lite finska. Jag behöver en tolk."
  ru: "Я говорю по-фински совсем немного. Мне нужен переводчик."
  et: "Räägin soome keelt ainult natuke. Vajan tõlki."
  uk: "Я розмовляю фінською зовсім трохи. Мені потрібен перекладач."
  ar: "أتكلم القليل من الفنلندية فقط. أحتاج إلى مترجم."
  so: "Waxaan ku hadlaa Finnish yar oo keliya. Waxaan u baahanahay turjumaan."
  fa: "فقط کمی فنلاندی صحبت می‌کنم. به مترجم نیاز دارم."
  zh: "我只会说一点芬兰语。我需要口译员。"
  yue: "我只係識講少少芬蘭話。我需要傳譯員。"
  vi: "Tôi chỉ nói được một chút tiếng Phần Lan. Tôi cần phiên dịch viên."
  th: "ฉันพูดภาษาฟินแลนด์ได้นิดหน่อย ฉันต้องการล่าม"
  bg: "Говоря само малко фински. Имам нужда от преводач."
step.call.my_language:
  en: "My language is {language}."
  fi: "Kieleni on {language}."
  sv: "Mitt språk är {language}."
  ru: "Мой язык — {language}."
  et: "Minu keel on {language}."
  uk: "Моя мова — {language}."
  ar: "لغتي هي {language}."
  so: "Luqaddaydu waa {language}."
  fa: "زبان من {language} است."
  zh: "我的语言是{language}。"
  yue: "我講{language}。"
  vi: "Ngôn ngữ của tôi là {language}."
  th: "ภาษาของฉันคือ {language}"
  bg: "Моят език: {language}."
step.call.symptoms:
  en: "I have these symptoms:"
  fi: "Minulla on nämä oireet:"
  sv: "Jag har de här symtomen:"
  ru: "У меня такие симптомы:"
  et: "Mul on need sümptomid:"
  uk: "У мене такі симптоми:"
  ar: "لدي هذه الأعراض:"
  so: "Waxaan qabaa calaamadahan:"
  fa: "این نشانه‌ها را دارم:"
  zh: "我有以下症状："
  yue: "我有以下症狀："
  vi: "Tôi có những triệu chứng sau:"
  th: "ฉันมีอาการเหล่านี้:"
  bg: "Имам следните симптоми:"
step.call.ask.id:
  en: "What is your personal identity code or date of birth?"
  fi: "Mikä on henkilötunnuksesi tai syntymäaikasi?"
  sv: "Vad är din personbeteckning eller ditt födelsedatum?"
  ru: "Какой у вас личный идентификационный код или дата рождения?"
  et: "Mis on teie isikukood või sünniaeg?"
  uk: "Який ваш особистий ідентифікаційний код або дата народження?"
  ar: "ما رقم هويتك الشخصية أو تاريخ ميلادك؟"
  so: "Waa maxay lambarkaaga aqoonsiga shakhsiga ama taariikhda dhalashadaada?"
  fa: "کد شناسایی شخصی یا تاریخ تولد شما چیست؟"
  zh: "您的个人身份号码或出生日期是什么？"
  yue: "你嘅個人身份號碼或者出世日期係幾多？"
  vi: "Mã số cá nhân hoặc ngày sinh của bạn là gì?"
  th: "รหัสประจำตัวบุคคลหรือวันเกิดของคุณคืออะไร"
  bg: "Какъв е вашият личен идентификационен код или датата ви на раждане?"
step.call.ask.phone:
  en: "Which number can we call you on?"
  fi: "Mihin numeroon voimme soittaa sinulle?"
  sv: "Vilket nummer kan vi ringa dig på?"
  ru: "По какому номеру вам можно позвонить?"
  et: "Mis numbril saame teile helistada?"
  uk: "За яким номером вам можна зателефонувати?"
  ar: "على أي رقم يمكننا الاتصال بك؟"
  so: "Lambarkee ayaan kugu soo wici karnaa?"
  fa: "با چه شماره‌ای می‌توانیم با شما تماس بگیریم؟"
  zh: "我们可以打哪个号码联系您？"
  yue: "我哋可以打邊個號碼搵你？"
  vi: "Chúng tôi có thể gọi cho bạn theo số nào?"
  th: "เราติดต่อคุณได้ที่เบอร์อะไร"
  bg: "На кой номер можем да ви се обадим?"
step.call.ask.since:
  en: "When did the symptoms start?"
  fi: "Milloin oireet alkoivat?"
  sv: "När började symtomen?"
  ru: "Когда начались симптомы?"
  et: "Millal sümptomid algasid?"
  uk: "Коли почалися симптоми?"
  ar: "متى بدأت الأعراض؟"
  so: "Goorma ayay calaamaduhu bilaabmeen?"
  fa: "نشانه‌ها از کی شروع شدند؟"
  zh: "症状是什么时候开始的？"
  yue: "啲症狀幾時開始？"
  vi: "Các triệu chứng bắt đầu khi nào?"
  th: "อาการเริ่มเมื่อไร"
  bg: "Кога започнаха симптомите?"
step.call.repeat:
  en: "Could you please repeat the time and the place slowly?"
  fi: "Voisitteko toistaa ajan ja paikan hitaasti?"
  sv: "Kan ni upprepa tiden och platsen långsamt?"
  ru: "Не могли бы вы медленно повторить время и место?"
  et: "Kas saaksite aja ja koha aeglaselt üle korrata?"
  uk: "Чи могли б ви повільно повторити час і місце?"
  ar: "هل يمكنك تكرار الموعد والمكان ببطء؟"
  so: "Ma ii ku celin kartaa waqtiga iyo goobta si tartiib ah?"
  fa: "می‌توانید زمان و مکان را آهسته تکرار کنید؟"
  zh: "您能慢慢再说一遍时间和地点吗？"
  yue: "你可唔可以慢慢再講一次時間同地點？"
  vi: "Bạn có thể nhắc lại thời gian và địa điểm thật chậm không?"
  th: "ช่วยพูดเวลาและสถานที่ซ้ำช้า ๆ ได้ไหม"
  bg: "Бихте ли повторили бавно часа и мястото?"
step.call.sms:
  en: "Could you send it to me as a text message?"
  fi: "Voisitteko lähettää sen minulle tekstiviestinä?"
  sv: "Kan ni skicka det till mig som sms?"
  ru: "Не могли бы вы прислать это мне SMS-сообщением?"
  et: "Kas saaksite selle mulle tekstisõnumiga saata?"
  uk: "Чи могли б ви надіслати це мені SMS-повідомленням?"
  ar: "هل يمكنك إرسال ذلك إليّ في رسالة نصية؟"
  so: "Ma ii soo diri kartaa fariin qoraal ah?"
  fa: "می‌توانید آن را با پیامک برایم بفرستید؟"
  zh: "您能用短信发给我吗？"
  yue: "你可唔可以用短訊send俾我？"
  vi: "Bạn có thể gửi cho tôi bằng tin nhắn không?"
  th: "ช่วยส่งเป็นข้อความ SMS ให้ฉันได้ไหม"
  bg: "Бихте ли ми го изпратили с текстово съобщение?"
step.call.thanks:
  en: "Thank you for your help. Goodbye."
  fi: "Kiitos avusta. Näkemiin."
  sv: "Tack för hjälpen. Hej då."
  ru: "Спасибо за помощь. До свидания."
  et: "Aitäh abi eest. Head aega."
  uk: "Дякую за допомогу. До побачення."
  ar: "شكرًا على المساعدة. مع السلامة."
  so: "Mahadsanid caawimaadda. Nabadgelyo."
  fa: "از کمکتان ممنونم. خداحافظ."
  zh: "谢谢您的帮助。再见。"
  yue: "多謝你幫忙。拜拜。"
  vi: "Cảm ơn bạn đã giúp đỡ. Tạm biệt."
  th: "ขอบคุณที่ช่วยเหลือ ลาก่อน"
  bg: "Благодаря за помощта. Довиждане."

# How long the symptoms have lasted (care_paths/domain/keys.ts SYMPTOM_DURATIONS).
# ui.journey.duration.* = the picker question and cards; step.call.since.* = the call-script line.
ui.journey.duration.title:
  en: "How long have you had them?"
  fi: "Kuinka kauan oireet ovat kestäneet?"
  sv: "Hur länge har du haft dem?"
  ru: "Как долго они у вас?"
  et: "Kui kaua need teil on olnud?"
  uk: "Як довго вони у вас?"
  ar: "منذ متى تعاني منها؟"
  so: "Muddo intee le'eg ayaad qabtay?"
  fa: "چه مدت است که آن‌ها را دارید؟"
  zh: "这些症状持续多久了？"
  yue: "呢啲症狀有幾耐？"
  vi: "Bạn bị như vậy bao lâu rồi?"
  th: "คุณมีอาการเหล่านี้มานานเท่าไร"
  bg: "Откога ги имате?"
ui.journey.duration.under_2_weeks:
  en: "Less than 2 weeks"
  fi: "Alle 2 viikkoa"
  sv: "Mindre än 2 veckor"
  ru: "Меньше 2 недель"
  et: "Vähem kui 2 nädalat"
  uk: "Менше 2 тижнів"
  ar: "أقل من أسبوعين"
  so: "Ka yar 2 toddobaad"
  fa: "کمتر از ۲ هفته"
  zh: "不到2周"
  yue: "少過2個星期"
  vi: "Dưới 2 tuần"
  th: "น้อยกว่า 2 สัปดาห์"
  bg: "По-малко от 2 седмици"
ui.journey.duration.weeks_2_4:
  en: "2 to 4 weeks"
  fi: "2–4 viikkoa"
  sv: "2–4 veckor"
  ru: "2–4 недели"
  et: "2–4 nädalat"
  uk: "2–4 тижні"
  ar: "من أسبوعين إلى 4 أسابيع"
  so: "2 ilaa 4 toddobaad"
  fa: "۲ تا ۴ هفته"
  zh: "2到4周"
  yue: "2至4個星期"
  vi: "2 đến 4 tuần"
  th: "2 ถึง 4 สัปดาห์"
  bg: "2 до 4 седмици"
ui.journey.duration.months_1_3:
  en: "1 to 3 months"
  fi: "1–3 kuukautta"
  sv: "1–3 månader"
  ru: "1–3 месяца"
  et: "1–3 kuud"
  uk: "1–3 місяці"
  ar: "من شهر إلى 3 أشهر"
  so: "1 ilaa 3 bilood"
  fa: "۱ تا ۳ ماه"
  zh: "1到3个月"
  yue: "1至3個月"
  vi: "1 đến 3 tháng"
  th: "1 ถึง 3 เดือน"
  bg: "1 до 3 месеца"
ui.journey.duration.over_3_months:
  en: "More than 3 months"
  fi: "Yli 3 kuukautta"
  sv: "Mer än 3 månader"
  ru: "Больше 3 месяцев"
  et: "Rohkem kui 3 kuud"
  uk: "Понад 3 місяці"
  ar: "أكثر من 3 أشهر"
  so: "Ka badan 3 bilood"
  fa: "بیش از ۳ ماه"
  zh: "超过3个月"
  yue: "超過3個月"
  vi: "Hơn 3 tháng"
  th: "มากกว่า 3 เดือน"
  bg: "Повече от 3 месеца"
step.call.since.under_2_weeks:
  en: "They started less than two weeks ago."
  fi: "Ne alkoivat alle kaksi viikkoa sitten."
  sv: "De började för mindre än två veckor sedan."
  ru: "Они начались меньше двух недель назад."
  et: "Need algasid vähem kui kaks nädalat tagasi."
  uk: "Вони почалися менше двох тижнів тому."
  ar: "بدأت منذ أقل من أسبوعين."
  so: "Waxay bilaabmeen wax ka yar laba toddobaad ka hor."
  fa: "کمتر از دو هفته پیش شروع شدند."
  zh: "症状是不到两周前开始的。"
  yue: "啲症狀係少過兩個星期之前開始。"
  vi: "Chúng bắt đầu chưa đến hai tuần trước."
  th: "อาการเริ่มเมื่อไม่ถึงสองสัปดาห์ก่อน"
  bg: "Започнаха преди по-малко от две седмици."
step.call.since.weeks_2_4:
  en: "They started 2–4 weeks ago."
  fi: "Ne alkoivat 2–4 viikkoa sitten."
  sv: "De började för 2–4 veckor sedan."
  ru: "Они начались 2–4 недели назад."
  et: "Need algasid 2–4 nädalat tagasi."
  uk: "Вони почалися 2–4 тижні тому."
  ar: "بدأت منذ أسبوعين إلى 4 أسابيع."
  so: "Waxay bilaabmeen 2 ilaa 4 toddobaad ka hor."
  fa: "۲ تا ۴ هفته پیش شروع شدند."
  zh: "症状是2到4周前开始的。"
  yue: "啲症狀係2至4個星期之前開始。"
  vi: "Chúng bắt đầu cách đây 2 đến 4 tuần."
  th: "อาการเริ่มเมื่อ 2 ถึง 4 สัปดาห์ก่อน"
  bg: "Започнаха преди 2–4 седмици."
step.call.since.months_1_3:
  en: "They started 1–3 months ago."
  fi: "Ne alkoivat 1–3 kuukautta sitten."
  sv: "De började för 1–3 månader sedan."
  ru: "Они начались 1–3 месяца назад."
  et: "Need algasid 1–3 kuud tagasi."
  uk: "Вони почалися 1–3 місяці тому."
  ar: "بدأت منذ شهر إلى 3 أشهر."
  so: "Waxay bilaabmeen 1 ilaa 3 bilood ka hor."
  fa: "۱ تا ۳ ماه پیش شروع شدند."
  zh: "症状是1到3个月前开始的。"
  yue: "啲症狀係1至3個月之前開始。"
  vi: "Chúng bắt đầu cách đây 1 đến 3 tháng."
  th: "อาการเริ่มเมื่อ 1 ถึง 3 เดือนก่อน"
  bg: "Започнаха преди 1–3 месеца."
step.call.since.over_3_months:
  en: "They started more than three months ago."
  fi: "Ne alkoivat yli kolme kuukautta sitten."
  sv: "De började för mer än tre månader sedan."
  ru: "Они начались больше трёх месяцев назад."
  et: "Need algasid rohkem kui kolm kuud tagasi."
  uk: "Вони почалися понад три місяці тому."
  ar: "بدأت منذ أكثر من 3 أشهر."
  so: "Waxay bilaabmeen in ka badan saddex bilood ka hor."
  fa: "بیش از سه ماه پیش شروع شدند."
  zh: "症状是三个多月前开始的。"
  yue: "啲症狀係三個幾月之前開始。"
  vi: "Chúng bắt đầu cách đây hơn ba tháng."
  th: "อาการเริ่มเมื่อกว่าสามเดือนก่อน"
  bg: "Започнаха преди повече от три месеца."
