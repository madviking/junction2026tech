# UI strings of the screening-letter way into Silta (frontend/src/features/screening):
# the example cervical screening invitation (/letter/cervical/:lang) and the visual guide its
# QR code opens (/r/:lang/learn/cervical). en + fi here; the other eleven languages are in
# texts.<lang>.yaml (machine-translated 14 Nov 2026, unchecked).
# Facts: HUS "Cervical cancer screening" and City of Helsinki screening pages (checked
# 14 Nov 2026): 25–65 every 5 years, free and voluntary, pre-booked time, reservation key + PIN,
# HPV test from 30, ~10 min visit, not during a period, no vaginal suppositories/gels 1–2 days
# before, Kela card/ID + health form, results by post/OmaPosti in ~2 months (not in OmaKanta
# or Maisa), colposcopy after abnormal results. The letter's person, address and codes are fictional.

