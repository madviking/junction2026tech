  fi: "Korttisi suomeksi"
  so: "Kaarkaaga oo Finnish ah"
  ar: "بطاقتك بالفنلندية"
ui.journey.contact.card_intro:
  en: "These sentences are already translated into Finnish. Read them out when you call, or show this screen at the reception. Finnish is on top, your language under it."
  fi: "Nämä lauseet ovat valmiiksi suomeksi. Lue ne ääneen, kun soitat, tai näytä tämä näkymä vastaanotossa."
  so: "Jumladahan horey ayaa loogu turjumay Finnish. Akhri marka aad wacayso, ama tus shaashaddan qolka soo dhaweynta. Finnish waa xagga sare, luqaddaaduna hoosta."
  ar: "هذه الجمل مترجمة مسبقًا إلى الفنلندية. اقرأها عندما تتصل، أو اعرض هذه الشاشة في مكتب الاستقبال. الفنلندية في الأعلى ولغتك تحتها."
ui.journey.contact.card_intro_print:
  en: "These sentences are already translated into Finnish. Read them out when you call, or show this card at the reception. Finnish is on top, your language under it."
  fi: "Nämä lauseet ovat valmiiksi suomeksi. Lue ne ääneen, kun soitat, tai näytä tämä kortti vastaanotossa."
  so: "Jumladahan horey ayaa loogu turjumay Finnish. Akhri marka aad wacayso, ama tus kaarkan qolka soo dhaweynta. Finnish waa xagga sare, luqaddaaduna hoosta."
  ar: "هذه الجمل مترجمة مسبقًا إلى الفنلندية. اقرأها عندما تتصل، أو اعرض هذه البطاقة في مكتب الاستقبال. الفنلندية في الأعلى ولغتك تحتها."
ui.journey.contact.card_code:
