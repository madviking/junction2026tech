# Emergency stage
ui.journey.emergency.title:
  en: "Call 112 now"
  fi: "Soita heti 112"
  so: "Hadda wac 112"
  ar: "اتصل بـ 112 الآن"
ui.journey.emergency.text:
  en: "These signs need help right away:"
  fi: "Nämä merkit vaativat apua heti:"
  so: "Calaamadahan waxay u baahan yihiin caawimaad degdeg ah:"
  ar: "هذه العلامات تحتاج إلى مساعدة فورية:"
