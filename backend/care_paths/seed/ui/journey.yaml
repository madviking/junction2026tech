  fi: "Syötä tämä koodi Siltan aloitussivulla, niin pääset takaisin tänne."
  so: "Ku qor koodkan bogga bilowga ee Silta si aad halkan ugu soo noqoto."
  ar: "أدخل هذا الرمز في صفحة بداية Silta للعودة إلى هنا."
