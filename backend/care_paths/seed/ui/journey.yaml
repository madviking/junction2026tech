# Visit stage
ui.journey.visit.card_link:
  en: "Show your visit card"
  fi: "Näytä käyntikorttisi"
  so: "Muuji kaarka booqashadaada"
  ar: "اعرض بطاقة زيارتك"

# Closed stage
ui.journey.closed.text:
  en: "Thank you. You can come back any time with your code."
  fi: "Kiitos. Voit palata milloin tahansa koodillasi."
  so: "Mahadsanid. Waxaad soo laaban kartaa wakhti kasta adigoo wata koodkaaga."
  ar: "شكراً لك. يمكنك العودة في أي وقت باستخدام رمزك."
ui.journey.visit_date.label:
  en: "When is your appointment?"
  fi: "Milloin aikasi on?"
  so: "Goorma ayuu ballantaadu yahay?"
  ar: "متى موعدك؟"
ui.journey.visit_date.hint:
  en: "Optional. Silta uses it to remind you and to show it on your visit card."
  fi: "Vapaaehtoinen. Silta muistuttaa sinua ja näyttää päivän käyntikortissasi."
  so: "Ikhtiyaari. Silta waxay u isticmaashaa inay ku xasuusiso."
  ar: "اختياري. يستخدمه Silta لتذكيرك وإظهاره على بطاقة الزيارة."
ui.journey.visit_date.save:
  en: "Save the date"
  fi: "Tallenna päivä"
  so: "Kaydi taariikhda"
  ar: "احفظ التاريخ"
ui.journey.visit_date.skip:
  en: "Continue without a date"
  fi: "Jatka ilman päivää"
  so: "Sii wad taariikh la'aan"
  ar: "تابع بدون تاريخ"
ui.journey.emergency.back_hint:
  en: "Tapped this by mistake, or did something change? Go back here."
  fi: "Painoitko vahingossa, tai muuttuiko jokin? Palaa tästä."
  so: "Si khalad ah ayaad u riixday, mise wax baa isbedelay? Halkan dib ugu noqo."
  ar: "هل ضغطت على هذا عن طريق الخطأ، أم تغيّر شيء ما؟ عُد من هنا."
