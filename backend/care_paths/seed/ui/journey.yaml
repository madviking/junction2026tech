  zh: "准备好后，请选择一张卡片，或用自己的话描述。"
  yue: "準備好之後，揀一張卡，或者用自己嘅說話講。"
  vi: "Khi bạn sẵn sàng, hãy chọn một thẻ hoặc mô tả bằng lời của bạn."
  th: "เมื่อพร้อมแล้ว เลือกการ์ด หรืออธิบายด้วยคำพูดของคุณเอง"
