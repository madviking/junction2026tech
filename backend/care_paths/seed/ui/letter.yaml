ui.letter.error_text:
  en: "Try again in a moment. If the letter gives a phone number, you can call it and say your language."
  fi: "Yritä hetken päästä uudelleen. Jos kirjeessä on puhelinnumero, voit soittaa siihen ja kertoa kielesi."
  sv: "Försök igen om en stund. Om brevet har ett telefonnummer kan du ringa det och säga ditt språk."
  ru: "Попробуйте ещё раз чуть позже. Если в письме есть номер телефона, можно позвонить и назвать свой язык."
  et: "Proovi hetke pärast uuesti. Kui kirjas on telefoninumber, võid sinna helistada ja öelda oma keele."
  uk: "Спробуйте ще раз трохи згодом. Якщо в листі є номер телефону, можна подзвонити і назвати свою мову."
  ar: "حاول مرة أخرى بعد قليل. إذا كان في الرسالة رقم هاتف، يمكنك الاتصال به وذكر لغتك."
  so: "Isku day mar kale wax yar ka dib. Haddii warqaddu leedahay lambar telefoon, waad wici kartaa oo sheegi kartaa luqaddaada."
  fa: "کمی بعد دوباره امتحان کنید. اگر در نامه شماره تلفنی هست، می‌توانید تماس بگیرید و زبان خود را بگویید."
  zh: "请稍后再试。如果信上有电话号码，您可以打过去并说明您的语言。"
  yue: "請遲啲再試。如果封信有電話號碼，你可以打過去同講你用咩語言。"
  vi: "Hãy thử lại sau giây lát. Nếu thư có số điện thoại, bạn có thể gọi và nói ngôn ngữ của mình."
  th: "ลองอีกครั้งในอีกสักครู่ ถ้าในจดหมายมีเบอร์โทรศัพท์ คุณโทรไปและบอกภาษาของคุณได้"
  bg: "Опитайте отново след малко. Ако в писмото има телефонен номер, можете да се обадите и да кажете езика си."
