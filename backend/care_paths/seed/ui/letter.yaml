# UI strings of "I got a letter" (frontend/src/features/letter, /r/:lang/letter): the resident
# takes a photo of a letter and gets it explained in their language (backend/letters).
# en + fi written by the team; the other eleven languages are machine-translated
# (14 Nov 2026, unchecked; Somali needs a native-speaker check before real use).
# The explanation itself (title, summary, steps) is machine-written per letter and is not here.

# --- Entry from the journey start screen ---
ui.letter.entry_title:
  en: "I got a letter"
  fi: "Sain kirjeen"
  sv: "Jag har fått ett brev"
  ru: "Я получил(а) письмо"
  et: "Sain kirja"
  uk: "Я отримав(ла) лист"
  ar: "وصلتني رسالة"
  so: "Warqad ayaa ii timid"
  fa: "نامه‌ای دریافت کرده‌ام"
  zh: "我收到了一封信"
  yue: "我收到咗一封信"
  vi: "Tôi nhận được một lá thư"
  th: "ฉันได้รับจดหมาย"
  bg: "Получих писмо"
ui.letter.entry_detail:
  en: "Take a photo. Silta explains it in your language."
  fi: "Ota kuva. Silta selittää sen omalla kielelläsi."
  sv: "Ta ett foto. Silta förklarar brevet på ditt språk."
  ru: "Сфотографируйте его. Silta объяснит на вашем языке."
  et: "Tee pilt. Silta selgitab seda sinu keeles."
  uk: "Сфотографуйте його. Silta пояснить вашою мовою."
  ar: "التقط صورة. Silta يشرحها بلغتك."
  so: "Sawir ka qaad. Silta ayaa kuugu sharxaysa luqaddaada."
  fa: "از آن عکس بگیرید. Silta به زبان شما توضیح می‌دهد."
  zh: "拍一张照片。Silta 用您的语言解释。"
  yue: "影張相。Silta 用你嘅語言解釋。"
  vi: "Chụp một tấm ảnh. Silta giải thích bằng ngôn ngữ của bạn."
  th: "ถ่ายรูปจดหมาย Silta จะอธิบายเป็นภาษาของคุณ"
  bg: "Снимайте го. Silta ще го обясни на вашия език."

