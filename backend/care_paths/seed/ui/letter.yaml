ui.letter.machine_text:
  en: "It can be wrong. Check the date, time and place in your letter."
  fi: "Se voi olla väärässä. Tarkista päivä, kellonaika ja paikka kirjeestäsi."
  sv: "Det kan ha fel. Kontrollera datum, tid och plats i ditt brev."
  ru: "Она может ошибаться. Проверьте дату, время и место в письме."
  et: "See võib eksida. Kontrolli kuupäeva, kellaaega ja kohta oma kirjast."
  uk: "Вона може помилятися. Перевірте дату, час і місце у листі."
  ar: "قد يكون خاطئًا. تحقق من التاريخ والوقت والمكان في رسالتك."
  so: "Wuu khaldami karaa. Ka hubi taariikhda, saacadda iyo goobta warqaddaada."
  fa: "ممکن است اشتباه باشد. تاریخ، ساعت و مکان را در نامه‌تان بررسی کنید."
  zh: "它可能出错。请对照信上的日期、时间和地点。"
  yue: "佢可能會錯。請對返封信上面嘅日期、時間同地點。"
  vi: "Nó có thể sai. Hãy kiểm tra ngày, giờ và địa điểm trong thư của bạn."
  th: "อาจมีข้อผิดพลาด โปรดตรวจวันที่ เวลา และสถานที่ในจดหมายของคุณ"
  bg: "Може да има грешки. Проверете датата, часа и мястото в писмото си."
