ui.letter.unreadable_text:
  en: "Take a new photo: the whole page, good light, hold the phone still."
  fi: "Ota uusi kuva: koko sivu, hyvä valo, pidä puhelin paikallaan."
  sv: "Ta ett nytt foto: hela sidan, bra ljus, håll telefonen stilla."
  ru: "Сделайте новое фото: вся страница, хороший свет, держите телефон неподвижно."
  et: "Tee uus pilt: kogu leht, hea valgus, hoia telefon paigal."
  uk: "Зробіть нове фото: вся сторінка, добре світло, тримайте телефон нерухомо."
  ar: "التقط صورة جديدة: الصفحة كلها، ضوء جيد، وثبّت الهاتف."
  so: "Sawir cusub qaad: bogga oo dhan, iftiin fiican, telefoonkana si deggan u hay."
  fa: "عکس تازه‌ای بگیرید: تمام صفحه، نور خوب، گوشی را ثابت نگه دارید."
  zh: "请重新拍一张：整页、光线好、手机拿稳。"
  yue: "請再影過一張：成版紙、光線好、揸穩部電話。"
  vi: "Hãy chụp lại: trọn cả trang, đủ sáng, giữ yên điện thoại."
  th: "ถ่ายรูปใหม่: ให้เห็นทั้งหน้า แสงสว่างพอ และถือโทรศัพท์ให้นิ่ง"
  bg: "Направете нова снимка: цялата страница, добра светлина, дръжте телефона неподвижно."
