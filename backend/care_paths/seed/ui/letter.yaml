ui.letter.intro:
  en: "Take a photo of the letter. Silta tells you what it says and what to do."
  fi: "Ota kirjeestä kuva. Silta kertoo, mitä siinä lukee ja mitä sinun pitää tehdä."
  sv: "Ta ett foto av brevet. Silta berättar vad det står och vad du ska göra."
  ru: "Сфотографируйте письмо. Silta расскажет, что в нём написано и что нужно сделать."
  et: "Tee kirjast pilt. Silta ütleb, mis seal kirjas on ja mida teha."
  uk: "Сфотографуйте лист. Silta розповість, що в ньому написано і що робити."
  ar: "التقط صورة للرسالة. Silta يخبرك بما فيها وماذا تفعل."
  so: "Sawir ka qaad warqadda. Silta ayaa kuu sheegaysa waxa ku qoran iyo waxa aad samaynayso."
  fa: "از نامه عکس بگیرید. Silta می‌گوید در آن چه نوشته شده و چه باید بکنید."
  zh: "给信拍一张照片。Silta 会告诉您信上写了什么、该怎么做。"
  yue: "同封信影張相。Silta 會話你知封信寫咩同要做啲咩。"
  vi: "Chụp ảnh lá thư. Silta cho bạn biết thư viết gì và bạn cần làm gì."
  th: "ถ่ายรูปจดหมาย Silta จะบอกว่าจดหมายเขียนว่าอะไรและคุณต้องทำอะไร"
  bg: "Снимайте писмото. Silta ще ви каже какво пише в него и какво да направите."
ui.letter.tip_light:
  en: "Put the letter on a table in good light."
  fi: "Laita kirje pöydälle hyvään valoon."
  sv: "Lägg brevet på ett bord i bra ljus."
  ru: "Положите письмо на стол при хорошем свете."
  et: "Pane kiri lauale hea valguse kätte."
  uk: "Покладіть лист на стіл при доброму світлі."
  ar: "ضع الرسالة على طاولة في ضوء جيد."
  so: "Warqadda dhig miis iftiin fiican leh."
  fa: "نامه را روی میز و در نور خوب بگذارید."
  zh: "把信放在光线好的桌子上。"
  yue: "將封信放喺光線好嘅枱面。"
  vi: "Đặt lá thư lên bàn, nơi đủ sáng."
  th: "วางจดหมายบนโต๊ะในที่ที่มีแสงสว่างพอ"
  bg: "Поставете писмото на маса на добра светлина."
ui.letter.tip_page:
  en: "Fit the whole page in the photo. One page at a time."
  fi: "Kuvaa koko sivu. Yksi sivu kerrallaan."
  sv: "Få med hela sidan på fotot. En sida åt gången."
  ru: "Вся страница должна попасть в кадр. По одной странице."
  et: "Kogu leht peab pildile mahtuma. Üks leht korraga."
  uk: "Уся сторінка має бути в кадрі. По одній сторінці."
  ar: "اجعل الصفحة كلها داخل الصورة. صفحة واحدة في كل مرة."
  so: "Bogga oo dhan ha ku jiro sawirka. Hal bog markiiba."
  fa: "تمام صفحه در عکس باشد. هر بار یک صفحه."
  zh: "让整页都在照片里。一次拍一页。"
  yue: "成版紙都要影到。每次影一版。"
  vi: "Chụp trọn cả trang. Mỗi lần một trang."
  th: "ถ่ายให้เห็นทั้งหน้า ครั้งละหนึ่งหน้า"
  bg: "Цялата страница трябва да се вижда на снимката. По една страница наведнъж."
ui.letter.privacy_title:
  en: "Your letter stays yours"
  fi: "Kirjeesi pysyy sinulla"
  sv: "Brevet förblir ditt"
  ru: "Письмо остаётся вашим"
  et: "Kiri jääb sinu omaks"
  uk: "Лист залишається вашим"
  ar: "رسالتك تبقى لك"
  so: "Warqaddaadu adigay kuu hadhaysaa"
  fa: "نامه‌تان نزد خودتان می‌ماند"
  zh: "您的信只属于您"
  yue: "封信始終係你嘅"
  vi: "Lá thư vẫn là của riêng bạn"
  th: "จดหมายยังเป็นของคุณ"
  bg: "Писмото остава ваше"
ui.letter.privacy:
  en: "The photo is sent once to a computer program that reads it. Silta does not save the photo or the text of the letter."
  fi: "Kuva lähetetään kerran tietokoneohjelmalle, joka lukee sen. Silta ei tallenna kuvaa eikä kirjeen tekstiä."
  sv: "Fotot skickas en gång till ett datorprogram som läser det. Silta sparar varken fotot eller brevets text."
  ru: "Фото один раз отправляется компьютерной программе, которая его читает. Silta не сохраняет ни фото, ни текст письма."
  et: "Pilt saadetakse üks kord arvutiprogrammile, mis seda loeb. Silta ei salvesta pilti ega kirja teksti."
  uk: "Фото один раз надсилається комп'ютерній програмі, яка його читає. Silta не зберігає ні фото, ні текст листа."
  ar: "تُرسل الصورة مرة واحدة إلى برنامج حاسوب يقرؤها. Silta لا يحفظ الصورة ولا نص الرسالة."
  so: "Sawirka hal mar ayaa loo diraa barnaamij kombiyuutar oo akhriya. Silta ma kaydiso sawirka iyo qoraalka warqadda midna."
  fa: "عکس یک بار برای یک برنامه رایانه‌ای فرستاده می‌شود تا آن را بخواند. Silta نه عکس را ذخیره می‌کند و نه متن نامه را."
  zh: "照片只发送一次，由电脑程序读取。Silta 不保存照片，也不保存信的内容。"
  yue: "張相只會傳送一次畀電腦程式讀取。Silta 唔會儲存張相，亦唔會儲存封信嘅內容。"
  vi: "Ảnh được gửi một lần đến một chương trình máy tính để đọc. Silta không lưu ảnh và không lưu nội dung thư."
  th: "รูปจะถูกส่งหนึ่งครั้งให้โปรแกรมคอมพิวเตอร์อ่าน Silta ไม่เก็บรูปและไม่เก็บข้อความในจดหมาย"
  bg: "Снимката се изпраща еднократно до компютърна програма, която я прочита. Silta не запазва снимката, нито текста на писмото."
