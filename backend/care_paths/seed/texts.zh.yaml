ui.screening.learn.after.home_title: "就诊后马上"
ui.screening.learn.after.home_body: "您可以马上继续您的日常活动。少量点滴出血是正常的。"
ui.screening.learn.after.results_title: "结果通过邮寄送达"
ui.screening.learn.after.results_body: "大约两个月内，结果会通过邮寄或OmaPosti送达。结果不会显示在OmaKanta或Maisa中。如果三个月后仍未收到，请致电实验室客服。"
ui.screening.learn.after.results_badge: "约2个月"
ui.screening.learn.after.normal_title: "结果正常"
ui.screening.learn.after.normal_body: "无需再做什么。大约五年后您会收到新的邀请。"
ui.screening.learn.after.more_title: "如果需要进一步检查"
ui.screening.learn.after.more_body: "您会收到一封附有说明的信。轻微变化会在两年内用新样本复查。其他变化由医生用放大仪器检查（阴道镜检查）。这并不意味着您得了癌症：变化常常会自行恢复，其余的也很容易治疗。"
ui.screening.learn.faq.title: "常见问题"
ui.screening.learn.faq.lead: "点击问题查看答案。"
ui.screening.learn.faq.hurt_q: "会疼吗？"
ui.screening.learn.faq.hurt_a: "通常不会。可能会短暂不舒服。如果疼请告诉护士，护士会停下或放慢。"
ui.screening.learn.faq.hpv_q: "HPV阳性是否意味着我得了癌症？"
ui.screening.learn.faq.hpv_a: "不是。HPV非常常见，通常会自行消失。阳性结果只是表示您需要再做一次检查。"
ui.screening.learn.faq.period_q: "我来月经了，怎么办？"
ui.screening.learn.faq.period_a: "请更改时间。月经期间不取样。其他分泌物没有影响。"
ui.screening.learn.faq.pregnant_q: "我怀孕了或正在哺乳。"
ui.screening.learn.faq.pregnant_a: "通常在怀孕35周之前以及哺乳期间都可以参加。分娩后，请等到产后出血停止。"
ui.screening.learn.faq.never_q: "我从未有过性生活，需要做检查吗？"
ui.screening.learn.faq.never_a: "您的风险很低，因为HPV通过性接触传播。您仍然可以参加：告诉护士，护士可以使用小号窥器。您也可以取消预约。"
ui.screening.learn.faq.cutting_q: "我接受过女性割礼，可以参加吗？"
ui.screening.learn.faq.cutting_a: "可以。取样前请告诉护士。护士可以放慢动作并使用较小的窥器。您也可以先要求看医生。"
ui.screening.learn.faq.removed_q: "我的子宫已被切除。"
ui.screening.learn.faq.removed_a: "仍然请来。这种情况下从阴道取样。"
ui.screening.learn.faq.time_q: "预约时间不合适。"
ui.screening.learn.faq.time_a: "用信中的预约码和PIN码在网上更改，或致电实验室客服。您可以选择任何一个采集筛查样本的HUS实验室。"
ui.screening.learn.faq.letter_q: "我把信弄丢了，或者根本没收到。"
ui.screening.learn.faq.letter_a: "请致电实验室客服。如果在您的筛查年份没有收到信，您可以自己预约。"
ui.screening.learn.faq.cost_q: "需要付费吗？"
ui.screening.learn.faq.cost_a: "不需要。筛查是免费的。"

