ui.screening.learn.why.no_symptoms_body: "เชื้อ HPV และความผิดปกติของเซลล์ระยะแรกไม่ทำให้เกิดอาการ ดังนั้นการตรวจนี้จึงมีไว้สำหรับผู้หญิงที่รู้สึกสุขภาพดี"
ui.screening.learn.why.hpv_title: "HPV พบได้บ่อยมาก"
ui.screening.learn.why.hpv_body: "คนส่วนใหญ่ติดเชื้อ HPV ในช่วงใดช่วงหนึ่งของชีวิต และมักหายไปเอง การมีเชื้อ HPV ไม่ใช่สัญญาณของการนอกใจ และไม่ได้บอกว่าคุณหรือคู่ของคุณไม่ดี"
ui.screening.learn.why.works_title: "การตรวจคัดกรองช่วยชีวิต"
ui.screening.learn.why.works_body: "นับตั้งแต่ฟินแลนด์เริ่มตรวจคัดกรอง มะเร็งปากมดลูกพบน้อยลงมาก การปกป้องที่ดีที่สุดคือเข้าร่วมทุกครั้งที่ได้รับเชิญ"
ui.screening.learn.why.works_badge: "ทุก 5 ปี"
