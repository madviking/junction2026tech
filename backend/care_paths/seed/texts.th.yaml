ui.screening.learn.visit.arrive_body: "ลงทะเบียนที่เคาน์เตอร์หรือเครื่องลงทะเบียน พยาบาลจะเรียกคุณเข้าห้องส่วนตัว การตรวจทั้งหมดใช้เวลาประมาณ 10 นาที"
ui.screening.learn.visit.arrive_badge: "10 นาที"
ui.screening.learn.visit.sample_title: "การเก็บตัวอย่าง"
ui.screening.learn.visit.sample_body: "คุณถอดเสื้อผ้าท่อนล่างตั้งแต่เอวลงไป แล้วนอนบนเตียงตรวจ สามารถสวมเสื้อตัวยาวหรือกระโปรงไว้ได้ พยาบาลจะใช้อุปกรณ์เล็กๆ (เครื่องถ่างช่องคลอด) เปิดช่องคลอดเบาๆ และเก็บเซลล์ด้วยแปรงนุ่ม ใช้เวลาไม่กี่นาที"
ui.screening.learn.visit.feel_title: "รู้สึกอย่างไร"
ui.screening.learn.visit.feel_body: "อาจรู้สึกไม่สบายเล็กน้อย แต่ไม่ควรเจ็บ หายใจช้าๆ และผ่อนคลายขา บอกพยาบาลหากรู้สึกเจ็บ คุณขอหยุดพักได้"
ui.screening.learn.rights.title: "สิทธิของคุณ"
ui.screening.learn.rights.lead: "คุณเป็นผู้ตัดสินใจเรื่องร่างกายและการตรวจของคุณ"
ui.screening.learn.rights.intro_title: "คุณเป็นผู้ตัดสินใจ"
ui.screening.learn.rights.intro_body: "นี่คือสิทธิของคุณเมื่อมาตรวจคัดกรอง คุณขอสิ่งใดก็ได้ในนี้"
ui.screening.learn.rights.female: "คุณขอให้ผู้หญิงเป็นผู้เก็บตัวอย่างได้ ผู้เก็บตัวอย่างส่วนใหญ่เป็นผู้หญิง"
ui.screening.learn.rights.interpreter: "คุณขอล่ามได้ บอกภาษาของคุณเมื่อโทรหาฝ่ายบริการลูกค้า"
ui.screening.learn.rights.companion: "คุณพาคนที่ไว้ใจมาด้วยได้"
ui.screening.learn.rights.stop: "คุณขอให้พยาบาลหยุดหรือพักได้ตลอดเวลา"
ui.screening.learn.rights.choice: "การเข้าร่วมไม่มีค่าใช้จ่ายและเป็นทางเลือกของคุณเอง คุณเปลี่ยนเวลาหรือปฏิเสธได้"
ui.screening.learn.rights.private: "เจ้าหน้าที่ต้องเก็บข้อมูลของคุณเป็นความลับ"
ui.screening.learn.phrase.title: "แสดงสิ่งนี้ที่เคาน์เตอร์"
ui.screening.learn.phrase.lead: "ประโยคสั้นๆ ภาษาฟินแลนด์ แสดงหน้าจอหรือกดเล่น"
ui.screening.learn.phrase.female_fi: "Toivoisin, että näytteen ottaa nainen."
ui.screening.learn.phrase.female_meaning: "ฉันอยากให้ผู้หญิงเป็นผู้เก็บตัวอย่าง"
ui.screening.learn.phrase.interpreter_fi: "Tarvitsen tulkin."
ui.screening.learn.phrase.interpreter_meaning: "ฉันต้องการล่าม"
ui.screening.learn.phrase.slow_fi: "Jännittää. Voisitko edetä hitaasti?"
ui.screening.learn.phrase.slow_meaning: "ฉันกังวล ช่วยทำช้าๆ ได้ไหม"
ui.screening.learn.after.title: "หลังการตรวจ"
ui.screening.learn.after.lead: "ผลจะมาเมื่อไหร่และหมายความว่าอะไร"
ui.screening.learn.after.home_title: "ทันทีหลังการตรวจ"
ui.screening.learn.after.home_body: "คุณกลับไปใช้ชีวิตตามปกติได้ทันที มีเลือดออกกะปริดกะปรอยเล็กน้อยถือเป็นเรื่องปกติ"
ui.screening.learn.after.results_title: "ผลจะส่งทางไปรษณีย์"
ui.screening.learn.after.results_body: "ผลจะส่งทางไปรษณีย์หรือ OmaPosti ภายในประมาณสองเดือน ผลจะไม่แสดงใน OmaKanta หรือ Maisa หากผ่านไปสามเดือนแล้วยังไม่ได้รับ ให้โทรหาฝ่ายบริการลูกค้าของห้องปฏิบัติการ"
ui.screening.learn.after.results_badge: "ประมาณ 2 เดือน"
ui.screening.learn.after.normal_title: "ผลปกติ"
ui.screening.learn.after.normal_body: "ไม่ต้องทำอะไรเพิ่ม คุณจะได้รับจดหมายเชิญใหม่ในอีกประมาณห้าปี"
ui.screening.learn.after.more_title: "หากต้องตรวจเพิ่มเติม"
ui.screening.learn.after.more_body: "คุณจะได้รับจดหมายพร้อมคำแนะนำ ความผิดปกติเล็กน้อยจะตรวจซ้ำด้วยตัวอย่างใหม่ภายในสองปี ความผิดปกติอื่นแพทย์จะตรวจด้วยกล้องขยาย (การส่องกล้องปากมดลูก) ซึ่งไม่ได้หมายความว่าคุณเป็นมะเร็ง ความผิดปกติมักหายได้เอง ส่วนที่เหลือรักษาได้ง่าย"
ui.screening.learn.faq.title: "คำถามที่พบบ่อย"
ui.screening.learn.faq.lead: "แตะคำถามเพื่อดูคำตอบ"
ui.screening.learn.faq.hurt_q: "เจ็บไหม?"
ui.screening.learn.faq.hurt_a: "ส่วนใหญ่ไม่เจ็บ อาจรู้สึกไม่สบายชั่วครู่ บอกพยาบาลหากเจ็บ พยาบาลจะหยุดหรือทำช้าลง"
ui.screening.learn.faq.hpv_q: "ผล HPV เป็นบวกหมายความว่าฉันเป็นมะเร็งหรือไม่?"
ui.screening.learn.faq.hpv_a: "ไม่ใช่ HPV พบได้บ่อยมากและมักหายไปเอง ผลบวกหมายความเพียงว่าคุณต้องตรวจอีกครั้ง"
ui.screening.learn.faq.period_q: "ประจำเดือนมา ควรทำอย่างไร?"
ui.screening.learn.faq.period_a: "เปลี่ยนเวลานัด จะไม่เก็บตัวอย่างระหว่างมีประจำเดือน ตกขาวอื่นๆ ไม่เป็นปัญหา"
ui.screening.learn.faq.pregnant_q: "ฉันตั้งครรภ์หรือให้นมลูกอยู่"
ui.screening.learn.faq.pregnant_a: "โดยทั่วไปเข้าร่วมได้จนถึงสัปดาห์ที่ 35 ของการตั้งครรภ์ และระหว่างให้นมลูก หลังคลอดให้รอจนน้ำคาวปลาหยุด"
ui.screening.learn.faq.never_q: "ฉันไม่เคยมีเพศสัมพันธ์ ต้องตรวจไหม?"
ui.screening.learn.faq.never_a: "ความเสี่ยงของคุณต่ำมาก เพราะ HPV ติดต่อทางการสัมผัสทางเพศ คุณยังเข้าร่วมได้: บอกพยาบาล ซึ่งสามารถใช้เครื่องถ่างขนาดเล็กได้ หรือคุณจะยกเลิกนัดก็ได้"
ui.screening.learn.faq.cutting_q: "ฉันเคยผ่านการขลิบอวัยวะเพศหญิง เข้าร่วมได้ไหม?"
ui.screening.learn.faq.cutting_a: "ได้ บอกพยาบาลก่อนเก็บตัวอย่าง พยาบาลจะทำช้าๆ และใช้เครื่องถ่างขนาดเล็กกว่าได้ คุณยังขอพบแพทย์ก่อนก็ได้"
ui.screening.learn.faq.removed_q: "ฉันผ่าตัดมดลูกออกแล้ว"
ui.screening.learn.faq.removed_a: "ยังคงควรมาตรวจ ในกรณีนี้จะเก็บตัวอย่างจากช่องคลอด"
ui.screening.learn.faq.time_q: "เวลานัดไม่สะดวก"
ui.screening.learn.faq.time_a: "เปลี่ยนทางออนไลน์ด้วยรหัสการจองและรหัส PIN ในจดหมาย หรือโทรหาฝ่ายบริการลูกค้าของห้องปฏิบัติการ คุณเลือกห้องปฏิบัติการของ HUS แห่งใดก็ได้ที่เก็บตัวอย่างตรวจคัดกรอง"
ui.screening.learn.faq.letter_q: "ฉันทำจดหมายหาย หรือไม่เคยได้รับ"
ui.screening.learn.faq.letter_a: "โทรหาฝ่ายบริการลูกค้าของห้องปฏิบัติการ หากไม่ได้รับจดหมายในปีที่คุณต้องตรวจคัดกรอง คุณจองเวลาเองได้"
ui.screening.learn.faq.cost_q: "มีค่าใช้จ่ายไหม?"
ui.screening.learn.faq.cost_a: "ไม่มี การตรวจคัดกรองไม่มีค่าใช้จ่าย"

