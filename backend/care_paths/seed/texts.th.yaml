ui.screening.learn.why.early_body: "มะเร็งปากมดลูกเติบโตช้า ใช้เวลาหลายปี การตรวจพบความผิดปกติของเซลล์ได้นานก่อนที่จะกลายเป็นมะเร็ง ความผิดปกติระยะแรกรักษาได้ง่าย"
