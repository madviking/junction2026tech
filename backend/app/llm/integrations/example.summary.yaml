# Copy this file for every new LLM feature. File name = key = usage feature name.
key: example.summary
description: >-
  Reference integration used by the LLM smoke CLI and tests. Input: a short text.
  Output: SummaryOutput (headline, up to three bullet points). A bad answer only
  costs a failed smoke test.
provider: openrouter
model: openai/gpt-4.1-mini
fallback_provider: openrouter
fallback_model: openai/gpt-4o-mini
temperature: 0.2
max_tokens: 400
prompts:
  - example_summary_system
