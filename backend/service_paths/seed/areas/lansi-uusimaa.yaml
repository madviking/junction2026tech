findings:
  - key: luvn-wait-over-week
    stage: primary_visit
    barrier: B2
    finding: "In 2025, 40.0% of non-urgent doctor visits in Länsi-Uusimaa waited over 7 days from the needs assessment (Espoo 33.9%, Finland 54.7%)."
    status: published
    verified_on: 2026-11-13
    source: sotkanet-6411
  - key: luvn-wait-over-three-months
    stage: primary_visit
    barrier: B2
    finding: "In 2025, 0.1% of non-urgent doctor visits in Länsi-Uusimaa waited over 3 months, against 1.7% in Finland."
    status: published
    verified_on: 2026-11-13
    source: sotkanet-6410
  - key: luvn-limit-relaxed
    stage: primary_visit
    finding: "The legal limit for non-urgent primary care was relaxed from 14 days to 3 months on 1 Jan 2025, and SOSTE reports somewhat weaker access since."
    status: published
    verified_on: 2026-11-13
    source: soste-hoitotakuu
  - key: luvn-phone-callback
    stage: contact
    barrier: B2
    finding: "Booking at the Espoo health centre is by phone on weekdays 8–15:30 with a nurse callback."
    status: published
    verified_on: 2026-11-13
    source: espoo-booking
  - key: luvn-lunna-bank-codes
    stage: contact
    finding: "Lunna cannot be used without Finnish online-banking codes or mobile ID."
    status: published
    verified_on: 2026-11-13
    source: espoo-hello
  - key: luvn-lunna-languages
    stage: contact
    finding: "Lunna works in Finnish, Swedish and English only."
    status: published
    verified_on: 2026-11-13
    source: sttinfo-lunna
  - key: luvn-interpreter-procedure
    stage: contact
    barrier: B7
    finding: "No luvn.fi page describes the interpreter right, cost or booking procedure; callers can ask for an interpreter on the booking call and the 116117 callback, and it is free by the national rule, which is not confirmed for Länsi-Uusimaa."
    status: draft
    source: espoo-hello
  - key: luvn-ai-interpreting-scope
    stage: contact
    barrier: B7
    finding: "Länsi-Uusimaa's real-time AI interpreting is described for maternity and child clinics, integration social services and youth services."
    status: published
    verified_on: 2026-11-13
    source: luvn-ai-interpreting
  - key: luvn-rare-language-interpreters
    stage: primary_visit
    barrier: B7
    finding: "Interpreters for rarer languages are hard to get, and state targeted funding for interpreting changed in 2025."
    status: draft
    source: solita-interpreting
  - key: luvn-letters-finnish
    stage: screening_invitation
    finding: "Screening, HUS appointment and colorectal result letters and Maisa notices come in Finnish; no other-language versions were found, which is not confirmed."
    status: draft
    source: hus-pathway
  - key: luvn-no-electronic-screening-invites
    stage: screening_invitation
    finding: "Fimlab's electronic screening invitations and home HPV self-sampling pilot do not cover Uusimaa, so invitations here stay letters."
    status: draft
    source: fimlab-self-sampling
  - key: luvn-doctor-fee-noshow
    stage: primary_visit
    barrier: B1
    finding: "A Länsi-Uusimaa doctor visit costs 30.20 EUR for each of the first 3 visits a year, and a no-show costs 56.70 EUR unless cancelled by 12:00 on the previous working day."
    status: published
    verified_on: 2026-11-13
    source: luvn-health-centre
  - key: luvn-noshow-understanding
    stage: primary_visit
    finding: "A no-show fee may be charged only if the booking said so and gave cancellation instructions the client sufficiently understands (Client Fees Act section 3, quoted in the LUVN fee list)."
    status: published
    verified_on: 2026-11-13
    source: luvn-fees
  - key: luvn-eligibility-confusion
    stage: contact
    barrier: B8
    finding: "EU citizens without an EHIC, people waiting for a home municipality and undocumented people (narrower national law from 2026) face full charges or urgent care only."
    status: published
    verified_on: 2026-11-13
    source: kela-eu
  - key: luvn-undocumented-unknown
    stage: contact
    barrier: B8
    finding: "No public decision or page on care for undocumented people was found for Länsi-Uusimaa, so local rules beyond the national urgent-care duty are unverified."
    status: draft
    source: valtioneuvosto-undocumented
  - key: luvn-continuity
    stage: primary_visit
    finding: "Nationally only about half of non-urgent health-station doctor visits happened within a week in spring 2023, and continuity of care is poor."
    status: published
    verified_on: 2026-11-13
    source: sttinfo-visits-week
  - key: luvn-diagnostic-delay
    stage: diagnostics
    finding: "About one in three cancer patients felt their diagnosis was delayed (patient survey)."
    status: published
    verified_on: 2026-11-13
    source: sttinfo-delay-survey
  - key: luvn-fewer-screening-sites
    stage: screening_invitation
    barrier: B3
    finding: "A reader's letter says LUVN mammography has been offered in only three places since 2025, which conflicts with the provider list on luvn.fi."
    status: disputed
    source: kirkkonummen-sanomat
