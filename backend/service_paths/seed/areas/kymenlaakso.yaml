findings:
  - key: friday-nurse-line
    stage: screening_followup
    barrier: B2
    finding: A person with a positive colorectal test must phone the screening nurse, who is reachable only on Fridays 9–11 and 12–14 (about 4 hours a week).
    status: published
    verified_on: 2026-11-14
    source: syopa

  - key: colorectal-followup-gap-hypothesis
    stage: screening_followup
    barrier: B1
    finding: Hypothesis only; a reported 38% of positive colorectal tests without a colonoscopy could not be confirmed, and the Friday-only nurse line and the 71.30 EUR colonoscopy clinic fee may contribute.
    status: draft
    source: syopa

  - key: low-colorectal-participation
    stage: screening_invitation
    finding: Colorectal screening participation in Kymenlaakso was 70.0% in 2024 against 73.5% in Finland.
    status: published
    verified_on: 2026-11-14
    source: sotkanet-6103

  - key: omaolo-switched-off
    stage: contact
    finding: Omaolo use ended in the county on 30 Oct 2025, so the symptom questionnaire now sits in the Oma Kymenlaakso chat, which needs Suomi.fi strong identification and supports only Finnish, Swedish and English.
    status: published
    verified_on: 2026-11-14
    source: omaolo

  - key: phone-first-callback
    stage: contact
    barrier: B2
    finding: Contact is by phone first through one recorded menu, hidden numbers cannot leave a callback request and only two callback attempts are made.
    status: published
    verified_on: 2026-11-14
    source: contact

  - key: interpreter-route-undocumented
    stage: contact
    barrier: B7
    finding: No page on kymenhva.fi describes interpreting for patients, so the right to a free interpreter in this county is unverified.
    status: draft
    source: contact

  - key: station-closures-planned
    stage: primary_visit
    barrier: B3
    finding: The June 2026 base proposal would close the Virolahti and Pyhtää stations by 2027 and Länsi-Kotka and Katajaharju by 2030; the county board voted 8–5 on 2 June 2026 not to decide yet and the county council decides.
    status: published
    verified_on: 2026-11-14
    source: yle-stations

  - key: staff-cuts-2027
    stage: primary_visit
    finding: The county board started co-operation negotiations on 4 Aug 2026 covering up to about 280 person-years of cuts and 40 million EUR of savings for 2027, with hiring only by permit.
    status: published
    verified_on: 2026-11-14
    source: yle-savings

  - key: omalaakari-transition
    stage: primary_visit
    finding: The personal doctor and nurse model starts in September 2026 at Hamina and Kotkansaari and reaches all residents by end of 2027, and the county calls it a major effort and asks residents for patience.
    status: published
    verified_on: 2026-11-14
    source: sttinfo-omalaakari

  - key: no-show-fee-conflict
    stage: primary_visit
    barrier: B1
    finding: The fee page shows a no-show fee of 73.70 EUR while the December 2025 fee-list PDF shows 60.60 EUR with a note that a law change would raise it to 73.70 EUR.
    status: disputed
    source: fees
