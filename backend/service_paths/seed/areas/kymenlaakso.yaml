    name_en: Shared booking and advice line
    phone: 05 220 2000
    hours: Mon–Fri 7–20
    contact_note: "One number serves all health stations in the county. Leave a callback request through the recorded menu and listen to the recording to the end, otherwise it does not register. Hidden numbers cannot leave a request. Text service for people with hearing impairment 040 181 3036 (Mon–Fri 7–20); cancellation SMS 040 1810 961."
