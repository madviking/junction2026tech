findings:
  - key: waits-over-7-days-worsening
    stage: primary_visit
    barrier: B2
    finding: "Non-urgent doctor visits waiting over 7 days rose from 26.1% in 2023 to 38.6% in 2024 and 67.8% in 2025 (Finland 54.7%), though waits over 3 months stay near 0%."
    status: published
    verified_on: 2026-11-14
    source: sotkanet-6411
  - key: specialist-first-visit-90-days
    stage: specialist_first_visit
    finding: "On 31 Oct 2026, 1,556 of 3,609 people (43%) waiting for a first specialist visit had waited over 90 days, median 72 days, while oncology had 0 over 90 days."
    status: published
    verified_on: 2026-11-14
    source: thl-hoitotakuu
  - key: screening-pages-finnish-only
    stage: screening_invitation
    finding: "The county's screening pages are in Finnish only, and no translated invitations or videos were found."
    status: published
    verified_on: 2026-11-14
    source: seulonnat
  - key: no-interpreter-procedure
    stage: contact
    barrier: B7
    finding: "No county page was found on ordering an interpreter, its cost, or remote interpreting."
    status: draft
    source: in-english
  - key: phone-first-callback
    stage: contact
    barrier: B2
    finding: "Access is phone-first with a callback, split into surname-initial lines in Seinäjoki, with office hours ending 15:30 (Fri 15:00); this is likely hard for people with little Finnish."
    status: draft
    source: seinajoki-brochure
  - key: omaep-login-unstated
    stage: contact
    barrier: B10
    finding: "OmaEP login method, chat languages and chat opening hours are not stated on the county page."
    status: draft
    source: omaep
  - key: service-cuts-and-distance
