findings:
  - key: hel-wait-over-week
    stage: primary_visit
    barrier: B2
    finding: "In 2025, 75.9% of non-urgent doctor visits in Helsinki waited over 7 days from the needs assessment, up from 66.6% in 2023 (Finland 54.7%)."
    status: published
    verified_on: 2026-11-13
    source: sotkanet-6411
  - key: hel-wait-over-three-months
    stage: primary_visit
    barrier: B2
    finding: "In 2025, 5.7% of non-urgent doctor visits in Helsinki waited over 3 months, beyond the legal limit, up from 0.7% in 2023 (Finland 1.7%)."
    status: published
    verified_on: 2026-11-13
    source: sotkanet-6410
  - key: hel-limit-relaxed
    stage: primary_visit
    finding: "The legal limit for non-urgent primary care was relaxed from 14 days to 3 months on 1 Jan 2025, and SOSTE reports somewhat weaker access since."
    status: published
    verified_on: 2026-11-13
    source: soste-hoitotakuu
  - key: hel-phone-first-callback
    stage: contact
    barrier: B2
    finding: "Helsinki health-station phone lines are short (Mon–Thu 8–16, Fri 8–15), the callback comes from an unknown number and is tried at most twice."
    status: published
    verified_on: 2026-11-13
    source: hel-phone
  - key: hel-digital-eid
    stage: contact
    finding: "Omaolo and Maisa need strong e-ID, so people without Finnish bank codes or mobile ID cannot use them."
    status: published
    verified_on: 2026-11-13
    source: hel-assessment
  - key: hel-digital-languages
    stage: contact
    finding: "Omaolo, Maisa and 116117 work in Finnish, Swedish and only partly English."
    status: published
    verified_on: 2026-11-13
    source: hel-suomi-116117
  - key: hel-interpreter-ask
    stage: contact
    barrier: B7
    finding: "A free interpreter is a right in Helsinki, but the patient has to state the language when booking."
    status: published
    verified_on: 2026-11-13
    source: hel-language-rights
  - key: hel-rare-language-interpreters
    stage: primary_visit
    barrier: B7
    finding: "Interpreters for rarer languages are hard to get, and state targeted funding for interpreting changed in 2025."
    status: draft
    source: solita-interpreting
  - key: hel-letters-finnish
    stage: screening_invitation
    finding: "Screening, HUS appointment and colorectal result letters and Maisa notices come in Finnish; no other-language versions were found, which is not confirmed."
    status: draft
