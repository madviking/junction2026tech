    routes: [A5, A6]
    name_fi: Vastaanottokeskuksen terveydenhoitaja
    name_en: Reception centre nurse
    contact_note: "While in the reception system, contact an employee of your reception centre or the reception centre nurse. 112 in urgent situations. After about 1 year of residence a home municipality can be applied for (DVV); care then moves to the health station."
    status: published
    verified_on: 2026-11-13
    source: migri-health
  - key: hel-kalasatama
    kind: health_station
    routes: [A7]
    name_fi: Kalasataman terveys- ja hyvinvointikeskus, paperittomat
