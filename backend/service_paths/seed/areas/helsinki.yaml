    name_en: Your own health station
    city: Helsinki
    contact_note: "Assigned by address; you may ask to change. Needs assessment by a professional."
    walk_in: "Walk in without an appointment: queue, seen by urgency. Use one channel only."
    interpreter_how: "If your mother tongue is not Finnish or Swedish, state it when booking. The interpreter service is free of charge for you."
    fee_note: "Health-station doctor and nurse visits free (2026). No-show or cancellation under 24 h before: 60.60 EUR for 18+, also for free visits (from 1 Mar 2026). Annual payment ceiling 815 EUR."
    url: https://www.hel.fi/en/health-and-social-services/health-care/health-stations/care-needs-assessment-and-booking-an-appointment-at-the-health-station
