    city: Helsinki
    hours: "Mon–Fri 8–11"
    walk_in: Walk-in needs assessment.
    contact_note: "Helsinki keeps necessary care for adults like residents. Under-18s and pregnant people get full resident services."
    fee_note: "Doctor and nurse visits free; emergency and dental care are charged."
    status: published
    verified_on: 2026-11-13
    source: hel-kalasatama
  - key: hel-global-clinic
    kind: volunteer_clinic
    routes: [A7]
    name_fi: Global Clinic
    name_en: Global Clinic
    city: Helsinki
    contact_note: "Free, confidential, volunteer-run advice and guidance (Helsinki and Turku). It does not report clients to the authorities."
    status: published
    verified_on: 2026-11-13
    source: hel-welcome
  - key: hel-private
    kind: private
    routes: [A4]
    name_fi: Yksityinen lääkäriasema
    name_en: Private clinic
    contact_note: "Faster to book but much more expensive. Kela's share can be deducted at the cash desk if you show your Kela card. The doctor can refer you to HUS."
    fee_note: "Kela reimburses 8 EUR per private doctor visit (from 1 Jan 2026). Lab or imaging tests ordered on a private referral do not count towards the 815 EUR public payment ceiling."
    status: published
    verified_on: 2026-11-13
    source: kela-private
  - key: hel-ehic
    kind: health_station
    routes: [A8]
    name_fi: Terveysasema (EHIC tai hoito-oikeustodistus)
    name_en: Health station with EHIC or right-to-care certificate
    city: Helsinki
    contact_note: "With an EHIC or a right-to-care certificate, medically necessary care at the resident's client fee; without one, in principle urgent care only at full cost. Nordic citizens: same terms and prices as Finns. Use the health station like route A1."
    status: draft
    source: kela-eu

