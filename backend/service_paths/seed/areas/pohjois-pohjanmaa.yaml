    name_en: "Digital sote-keskus (Oulu expansion 2024)"
    hours: "Chat staffed by professionals, evenings and weekends too; mental-health chat (16+) Mon–Fri 8–20 (2024 article, hours may have changed)"
    contact_note: "Handles conditions not needing a physical exam. Entered through the Pohde website or Omaolo. Expanded to Oulu on 25 Mar 2024. Service languages are not stated."
    digital_channel: "Professional-staffed chat; separate mental-health chat"
    digital_login: "Strong authentication (bank codes or mobile ID)"
    status: draft
