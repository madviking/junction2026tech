  - key: oys-emergency
    kind: emergency
    routes: [A1]
    name_fi: "Oulun seudun yhteispäivystys (OYS)"
    name_en: "Oulu area joint emergency department (OYS)"
    city: Oulu
    hours: "24 h"
    contact_note: "OYS building B, 1st floor, Kajaanintie 50. Under-16s go to the children's emergency unit. No separate call needed if your health centre refers you. Since 21 Sep 2026 urgent reception in Oulu and Kempele is booked by phone or chat (walk-ins still accepted). Raahe and Oulainen urgent clinics are open daily 8–22; Kuusamo health-centre emergency at all hours. 112 for life-threatening situations."
    fee_note: "2026: specialist doctor at the Oulu-area joint emergency EUR 71.30 at any time; under-18s free (effective dates not stated on the page)."
    url: https://pohde.fi/palvelut/paivystys/
    status: published
    verified_on: 2026-11-14
    source: pohde-emergency
  - key: oys
    kind: specialist_hospital
    routes: [A1, A2, A4]
    name_fi: "Oulun yliopistollinen sairaala (OYS)"
    name_en: "Oulu University Hospital (OYS)"
    city: Oulu
    contact_note: "Specialist care mainly by referral from a health centre, occupational health or a private doctor. The referral is processed within three weeks, then an appointment letter says when, where and how to prepare. Patient Billing Unit for international patients Mon–Thu 9:00–14:30."
    service_languages: [en]
    interpreter_how: "Interpreter arranged whenever possible; state the need when booking. Customer service in English."
    fee_note: "2026: specialist outpatient visit EUR 71.30; under-18s exempt; remote visits 15% cheaper."
    url: https://oys.fi/en/front-page/services/information-for-patients/
    status: published
    verified_on: 2026-11-14
    source: oys-patients
  - key: oys-cancer-centre
