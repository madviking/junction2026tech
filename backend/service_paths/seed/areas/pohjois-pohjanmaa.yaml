    routes: [A1, A2, A4]
    name_fi: "OYS Syöpäkeskus"
    name_en: "OYS Cancer Centre"
    city: Oulu
    contact_note: "OYS Syöpäkeskus works with the urology and oncology clinics and the Vatsakeskus. Other digital care paths were developed with several company partners."
    digital_channel: "Digital care path for bladder cancer in Terveyskylä's Syöpätalo (since 20 Mar 2024): path models, texts and videos on diagnosis, treatment and follow-up"
