    name_en: "Your own social and health centre"
    city: Oulu
    contact_note: "Contact the clinic primarily by phone or by the chat in OmaPohde's digital sote-keskus, or visit in person. Local phone numbers appear only after choosing your municipality on the Pohde page. Oulu centres: Haukiputaan, Kaakkurin, Kiimingin, Kontinkankaan, Oulunsalon, Ruukin, Tuiran."
    interpreter_how: "Tell the clinic when you book that you need an interpreter. Interpreters keep confidentiality and only interpret."
    fee_note: "2026: doctor EUR 30.20 per visit, at most three visits per calendar year (remote doctor visit EUR 25.70); nurse free when the nurse holds main responsibility; under-18s exempt."
    url: https://pohde.fi/yhteystiedot/terveyskeskukset/
    status: published
    verified_on: 2026-11-14
    source: pohde-reception
