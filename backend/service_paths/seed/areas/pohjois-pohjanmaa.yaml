    routes: [A1]
    name_fi: "Päivystysapu 116117"
    name_en: "After-hours advice 116117"
    phone: "116117"
    hours: "24 h, free"
    contact_note: "Call first when the health centre is closed; a backup number is on the Pohde page. 112 for life-threatening situations."
    url: https://pohde.fi/palvelut/paivystys/
    status: published
    verified_on: 2026-11-14
