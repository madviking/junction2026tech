# Local development.
#   docker compose up -d                 → PostgreSQL, Redis, migrations (run apps on the host)
#   docker compose --profile app up -d   → also backend + frontend containers
# Data persists in named volumes; `docker compose down -v` deletes it.
name: junction2026

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app_local_only}@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Inside a container, the host's SSH tunnel to mistral is host.docker.internal.
  MISTRAL_BASE_URL: http://host.docker.internal:18001/v1
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5300}"]'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Ephemeral state only: evict least-recently-used keys under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrations:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://app:${POSTGRES_PASSWORD:-app_local_only}@postgres:5432/app?sslmode=disable
      - up
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      target: dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8300}:8000"
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5300}:5300"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
