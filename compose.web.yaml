# Manifest for the Aiven Runtime application `silta-web` (the frontend) only; not used locally.
# Builds frontend/Dockerfile (its last stage, `production`: the static build served by nginx).
# nginx proxies /api/ to the API application, so the browser talks to one origin and the
# API needs no CORS entry. See docs/deployment.md.
services:
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      API_UPSTREAM: https://easily-smart-aphid.eur-1.aiven.app
