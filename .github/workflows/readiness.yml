name: readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://app:app_ci_only@localhost:5434/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply migrations
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.19.1 \
            -path=/migrations -database "postgres://app:app_ci_only@localhost:5434/app?sslmode=disable" up
      - name: Install
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci
      - name: Readiness gate
        run: bash dev_readiness_check.sh --all --report-json tmp/readiness.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: tmp/readiness.json
          if-no-files-found: ignore
