name: readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  ENCORE_VERSION: "1.58.1" # keep equal to encore.dev in backend/package.json

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install Encore CLI
        run: |
          curl -fsSL https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      # encore test starts its own Postgres (with pgvector) in Docker and applies backend/db/migrations.
      - name: Readiness gate
        run: bash dev_readiness_check.sh --all --report-json tmp/readiness.json
      - name: Build the self-hosted image
        if: hashFiles('backend/infra.config.json') != ''
        run: cd backend && encore build docker --config infra.config.json silta-api:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: tmp/readiness.json
          if-no-files-found: ignore
