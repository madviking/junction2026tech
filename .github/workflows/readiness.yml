name: readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  ENCORE_VERSION: "1.58.1" # keep equal to encore.dev in backend/package.json

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install Encore CLI
        run: |
          curl -fsSL https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      # CI has no .env: write placeholder provider keys (adapter tests stub fetch; live tests
      # stay skipped) and a random VisitCodePepper into backend/.secrets.local.cue. Then
      # `encore check` generates backend/encore.gen (~encore/clients, ~encore/auth), which is
      # gitignored but needed by `tsc --noEmit` in the gate.
      - name: Test secrets and generated Encore types
        run: |
          printf 'GEMINI_API_KEY=ci-placeholder\nOPEN_ROUTER_API_KEY=ci-placeholder\nELEVEN_LABS_API_KEY=ci-placeholder\n' > .env
          python3 scripts/local_secrets.py
          cd backend && encore check
      # encore test starts its own Postgres (with pgvector) in Docker and applies backend/db/migrations.
      - name: Readiness gate
        run: bash dev_readiness_check.sh --all --report-json tmp/readiness.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: tmp/readiness.json
          if-no-files-found: ignore

  # Push to main: publish the self-hosted image and migrate Aiven. Aiven Runtime then
  # needs "Actions > Deploy latest commit" on the application (docs/deployment.md).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/silta-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Encore CLI
        run: |
          curl -fsSL https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Build image
        run: |
          cd backend && npm ci
          encore build docker --config infra.config.json "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
      # The image does not migrate, so the schema goes first.
      - name: Migrate Aiven
        env:
          AIVEN_SILTA_URL: ${{ secrets.AIVEN_SILTA_URL }}
        run: |
          test -n "$AIVEN_SILTA_URL" || { echo "::error::repository secret AIVEN_SILTA_URL is not set"; exit 1; }
          docker run --rm -e AIVEN_SILTA_URL -v "$PWD/backend/db/migrations:/migrations:ro" --entrypoint sh \
            migrate/migrate:v4.19.1 -c 'migrate -path /migrations -database "$AIVEN_SILTA_URL" up'
      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  # Push to main, after the image is published: redeploy both Runtime applications through
  # the API endpoint behind the console's "Deploy latest commit" button (same as the
  # presentation site). Needs the repository secret AIVEN_TOKEN (docs/deployment.md).
  # silta-api rebuilds deploy/aiven/Dockerfile (FROM the :main image pushed above);
  # silta-web rebuilds the frontend from this commit.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      AIVEN_PROJECT: appzio-d111
      API_URL: https://easily-smart-aphid.eur-1.aiven.app
      WEB_URL: https://fond-useful-corgi.eur-1.aiven.app
    steps:
      - name: Redeploy silta-api and silta-web on Aiven Runtime
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
        run: |
          test -n "$AIVEN_TOKEN" || { echo "::error::repository secret AIVEN_TOKEN is not set; see docs/deployment.md"; exit 1; }
          for service in silta-api silta-web; do
            status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
              -H "Authorization: aivenv1 $AIVEN_TOKEN" \
              "https://api.aiven.io/v1/project/$AIVEN_PROJECT/service/$service/application/redeploy")
            echo "$service: Aiven answered HTTP $status"
            if [ "$status" -ge 300 ]; then cat response.txt; exit 1; fi
          done
      - name: Check both applications still answer
        run: |
          # The old version keeps serving while the new one builds; this only catches a broken app.
          for url in "$API_URL/api/health" "$WEB_URL/" "$WEB_URL/api/health"; do
            ok=
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              if [ "$code" = "200" ]; then ok=1; echo "$url 200"; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::$url did not answer 200"; exit 1; }
          done
