# nginx template for the production image (frontend/Dockerfile, target `production`).
# The official nginx image renders /etc/nginx/templates/*.template at startup, replacing
# ${API_UPSTREAM} from the environment; nginx's own $variables are left alone.
# API_UPSTREAM = the API origin, e.g. https://easily-smart-aphid.eur-1.aiven.app (docs/deployment.md).
# The browser only ever talks to this origin, so the API needs no CORS entry for it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # The upstream is an HTTPS host behind a shared load balancer: send its own
        # name as Host and as TLS SNI, not the frontend's.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
